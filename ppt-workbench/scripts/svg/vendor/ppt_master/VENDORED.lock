  "localPatches": [
    {
      "path": "vendor/ppt_master/scripts/svg_to_pptx/drawingml_context.py",
      "reason": "Scale nested group translate values by the parent context scale so 1600x900 canvas normalization does not push child shapes outside ppt169 bounds."
    },
    {
      "path": "vendor/ppt_master/scripts/svg_to_pptx/drawingml_utils.py",
      "reason": "I-017: parse_font_family resolves the East Asian (CJK) typeface against fonts actually installed on the render host (fontconfig/fc-list), honoring the author's CSS EA fallback chain. Windows-only EA names (e.g. Microsoft YaHei) were substituted by Latin faces in the LibreOffice thumbnail pipeline, producing jagged/broken CJK glyphs. Latin typeface mapping and Windows-friendly fallback when fontconfig is absent are preserved."
    },
    {
      "path": "vendor/ppt_master/scripts/svg_to_pptx/drawingml_styles.py",
      "reason": "P2 true-3D: build_sp3d_xml emits controlled <a:scene3d>/<a:sp3d> from the data-effect-3d attribute (3 named presets: card-raised/button-soft/block-extruded), invalid input returns '' so the SVG input gate is the enforcing layer (render-primitive-effects-extension-design.md §1b)."
    },
    {
      "path": "vendor/ppt_master/scripts/svg_to_pptx/drawingml_elements.py",
      "reason": "P2 true-3D: _wrap_shape gains sp3d_xml appended on the effect line (empty-string byte-identical to keep pptx_sha256 stable); rect/circle/path/polygon/ellipse call build_sp3d_xml. polygon/ellipse also gained the previously-missing filter effect wiring (glow/shadow), matching rect/circle/path. I-018: single-line text boxes reserve proportional plus half-em width and use noAutofit so LibreOffice thumbnails neither wrap nor distort text that PowerPoint keeps on one line."
    }
  ],
