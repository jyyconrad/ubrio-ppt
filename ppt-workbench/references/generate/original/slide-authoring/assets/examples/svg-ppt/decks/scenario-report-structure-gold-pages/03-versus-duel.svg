<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720"><rect x="0" y="0" width="1280" height="720" fill="#F7F7FA"/><defs><linearGradient id="duel-l" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6B2D9C"/><stop offset="1" stop-color="#8B4FB8"/></linearGradient><linearGradient id="duel-r" x1="1" y1="0" x2="0" y2="0"><stop offset="0" stop-color="#2E1B5E"/><stop offset="1" stop-color="#4A2E7A"/></linearGradient></defs><text x="64" y="56" fill="#2E1B5E" font-family="Microsoft YaHei, Arial" font-size="25" font-weight="700">自研平台 VS 采购平台：一次对决式选型对比</text><text x="64" y="84" fill="#6B7280" font-family="Microsoft YaHei, Arial" font-size="13.5">同一预算下两条路线对碰 · 指标、优势、结论一屏看清</text><g id="duel-band-left"><polygon points="64,132 520,132 584,224 520,316 64,316 120,224" fill="url(#duel-l)"/><text x="110" y="162" fill="#E8DCF5" font-family="Microsoft YaHei, Arial" font-size="13">甲方 · 自建路线</text><text x="110" y="194" fill="#FFFFFF" font-family="Microsoft YaHei, Arial" font-size="24" font-weight="700">自研平台</text><text x="110" y="232" fill="#E8DCF5" font-family="Microsoft YaHei, Arial" font-size="14">首年投入</text><text x="500" y="232" fill="#FFFFFF" font-family="Microsoft YaHei, Arial" font-size="16" font-weight="700" text-anchor="end">¥180万</text><text x="110" y="257" fill="#E8DCF5" font-family="Microsoft YaHei, Arial" font-size="14">上线周期</text><text x="500" y="257" fill="#FFFFFF" font-family="Microsoft YaHei, Arial" font-size="16" font-weight="700" text-anchor="end">5 个月</text><text x="110" y="282" fill="#E8DCF5" font-family="Microsoft YaHei, Arial" font-size="14">可定制性</text><text x="500" y="282" fill="#FFFFFF" font-family="Microsoft YaHei, Arial" font-size="16" font-weight="700" text-anchor="end">高</text><text x="110" y="307" fill="#E8DCF5" font-family="Microsoft YaHei, Arial" font-size="14">三年总成本</text><text x="500" y="307" fill="#FFFFFF" font-family="Microsoft YaHei, Arial" font-size="16" font-weight="700" text-anchor="end">¥420万</text></g><g id="duel-band-right"><polygon points="1216,132 760,132 696,224 760,316 1216,316 1160,224" fill="url(#duel-r)"/><text x="1170" y="162" fill="#E8DCF5" font-family="Microsoft YaHei, Arial" font-size="13" text-anchor="end">乙方 · 采购路线</text><text x="1170" y="194" fill="#FFFFFF" font-family="Microsoft YaHei, Arial" font-size="24" font-weight="700" text-anchor="end">采购平台</text><text x="780" y="232" fill="#E8DCF5" font-family="Microsoft YaHei, Arial" font-size="14">首年投入</text><text x="1170" y="232" fill="#FFFFFF" font-family="Microsoft YaHei, Arial" font-size="16" font-weight="700" text-anchor="end">¥90万</text><text x="780" y="257" fill="#E8DCF5" font-family="Microsoft YaHei, Arial" font-size="14">上线周期</text><text x="1170" y="257" fill="#FFFFFF" font-family="Microsoft YaHei, Arial" font-size="16" font-weight="700" text-anchor="end">1 个月</text><text x="780" y="282" fill="#E8DCF5" font-family="Microsoft YaHei, Arial" font-size="14">可定制性</text><text x="1170" y="282" fill="#FFFFFF" font-family="Microsoft YaHei, Arial" font-size="16" font-weight="700" text-anchor="end">中</text><text x="780" y="307" fill="#E8DCF5" font-family="Microsoft YaHei, Arial" font-size="14">三年总成本</text><text x="1170" y="307" fill="#FFFFFF" font-family="Microsoft YaHei, Arial" font-size="16" font-weight="700" text-anchor="end">¥510万</text></g><circle cx="640" cy="224" r="52" fill="none" stroke="#EFE9F7" stroke-width="2"/><circle cx="640" cy="224" r="44" fill="#2E1B5E" stroke="#6B2D9C" stroke-width="4"/><text x="640" y="236" fill="#FFFFFF" font-family="Microsoft YaHei, Arial" font-size="32" font-weight="700" text-anchor="middle">VS</text><g id="edge-left"><rect x="64" y="350" width="560" height="38" rx="8" fill="#EFE9F7"/><text x="86" y="375" fill="#6B2D9C" font-family="Microsoft YaHei, Arial" font-size="16" font-weight="700">自研平台 · 关键优势</text><polygon points="76,407 76,421 88,414" fill="#6B2D9C"/><text x="100" y="418" fill="#2E1B5E" font-family="Microsoft YaHei, Arial" font-size="15" font-weight="700">掌控演进</text><text x="100" y="440" fill="#4B5563" font-family="Microsoft YaHei, Arial" font-size="13">核心能力自主可控，可按业务节奏持续迭代</text><polygon points="76,465 76,479 88,472" fill="#6B2D9C"/><text x="100" y="476" fill="#2E1B5E" font-family="Microsoft YaHei, Arial" font-size="15" font-weight="700">数据闭环</text><text x="100" y="498" fill="#4B5563" font-family="Microsoft YaHei, Arial" font-size="13">数据与模型沉淀在内部，形成长期壁垒</text><polygon points="76,523 76,537 88,530" fill="#6B2D9C"/><text x="100" y="534" fill="#2E1B5E" font-family="Microsoft YaHei, Arial" font-size="15" font-weight="700">深度适配</text><text x="100" y="556" fill="#4B5563" font-family="Microsoft YaHei, Arial" font-size="13">贴合专有业务流程，减少迁就式功能妥协</text></g><g id="edge-right"><rect x="656" y="350" width="560" height="38" rx="8" fill="#EFE9F7"/><text x="678" y="375" fill="#6B2D9C" font-family="Microsoft YaHei, Arial" font-size="16" font-weight="700">采购平台 · 主要顾虑</text><polygon points="668,407 668,421 680,414" fill="#6B2D9C"/><text x="692" y="418" fill="#2E1B5E" font-family="Microsoft YaHei, Arial" font-size="15" font-weight="700">受制于人</text><text x="692" y="440" fill="#4B5563" font-family="Microsoft YaHei, Arial" font-size="13">关键能力依赖供应商路线图与报价节奏</text><polygon points="668,465 668,479 680,472" fill="#6B2D9C"/><text x="692" y="476" fill="#2E1B5E" font-family="Microsoft YaHei, Arial" font-size="15" font-weight="700">定制受限</text><text x="692" y="498" fill="#4B5563" font-family="Microsoft YaHei, Arial" font-size="13">专有流程需二次开发，需求响应周期偏长</text><polygon points="668,523 668,537 680,530" fill="#6B2D9C"/><text x="692" y="534" fill="#2E1B5E" font-family="Microsoft YaHei, Arial" font-size="15" font-weight="700">成本走高</text><text x="692" y="556" fill="#4B5563" font-family="Microsoft YaHei, Arial" font-size="13">订阅与增购逐年叠加，三年总成本更高</text></g><g id="verdict-bar"><rect x="64" y="612" width="1152" height="60" rx="10" fill="#2E1B5E"/><text x="88" y="649" fill="#C9A8E8" font-family="Microsoft YaHei, Arial" font-size="15" font-weight="700">选型结论</text><text x="170" y="649" fill="#FFFFFF" font-family="Microsoft YaHei, Arial" font-size="16">预算紧、周期急优先采购平台；追求长期自主与数据壁垒，则自研三年更划算。</text></g></svg>