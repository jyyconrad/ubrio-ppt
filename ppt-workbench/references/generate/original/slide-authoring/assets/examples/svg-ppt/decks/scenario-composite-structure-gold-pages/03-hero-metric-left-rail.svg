<text x="738" y="508" fill="#15803D" font-family="Microsoft YaHei, Arial" font-size="17" font-weight="800" text-anchor="start">+2.4pt</text>
<text x="554" y="582" fill="#4A6480" font-family="Microsoft YaHei, Arial" font-size="14" font-weight="500" text-anchor="start">高毛利产品放量带动结构改善</text>
<rect x="554" y="600" width="96" height="26" rx="13" fill="#E3EDF9"/>
<text x="602" y="618" fill="#175A8C" font-family="Microsoft YaHei, Arial" font-size="13" font-weight="700" text-anchor="middle">同比口径</text>
<rect x="880" y="410" width="330" height="240" rx="14" fill="#F5F8FF"/>
<text x="904" y="452" fill="#102A43" font-family="Microsoft YaHei, Arial" font-size="17" font-weight="700" text-anchor="start">合同回款率</text>
<text x="904" y="514" fill="#102A43" font-family="Microsoft YaHei, Arial" font-size="40" font-weight="800" text-anchor="start">96.5%</text>
