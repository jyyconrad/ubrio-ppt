<text x="1100" y="508" fill="#15803D" font-family="Microsoft YaHei, Arial" font-size="17" font-weight="800" text-anchor="start">+1.2pt</text>
<text x="904" y="582" fill="#4A6480" font-family="Microsoft YaHei, Arial" font-size="14" font-weight="500" text-anchor="start">平均回款周期缩短至 38 天</text>
<rect x="904" y="600" width="108" height="26" rx="13" fill="#E3EDF9"/>
<text x="958" y="618" fill="#175A8C" font-family="Microsoft YaHei, Arial" font-size="13" font-weight="700" text-anchor="middle">连续 6 季达标</text>
<text x="70" y="698" fill="#8FA8CC" font-family="Microsoft YaHei, Arial" font-size="12" font-weight="500" text-anchor="start">数据口径：经营分析系统 2026Q2 快报；同比 = 较上年同期，达成率 = 累计完成 / 全年目标</text>
