<text x="554" y="452" fill="#102A43" font-family="Microsoft YaHei, Arial" font-size="17" font-weight="700" text-anchor="start">综合毛利率</text>
<text x="554" y="514" fill="#102A43" font-family="Microsoft YaHei, Arial" font-size="40" font-weight="800" text-anchor="start">41.8%</text>
