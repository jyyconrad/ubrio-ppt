<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect x="0" y="0" width="1280" height="720" fill="#8A1538" />
  <text x="72" y="70.4" fill="#F8D98A" font-family="Microsoft YaHei, Arial" font-size="14.4" font-weight="500" text-anchor="start">党政学习 / content</text>
  <text x="72" y="113.6" fill="#FFFFFF" font-family="Microsoft YaHei, Arial" font-size="33.6" font-weight="800" text-anchor="start">转化逻辑：从精神内涵到岗位行动再到组织机制</text>
  <text x="72" y="155.2" fill="#3B1F1F" font-family="Microsoft YaHei, Arial" font-size="16" font-weight="400" text-anchor="start">用层级结构避免只堆口号。</text>
  <rect x="432" y="228" width="416" height="89.6" rx="14.4" fill="#F8D98A" stroke="#D4A843" />
  <text x="460.8" y="264.8" fill="#FFFFFF" font-family="Microsoft YaHei, Arial" font-size="19.2" font-weight="900" text-anchor="start">组织机制</text>
  <text x="460.8" y="293.6" fill="#FFFFFF" font-family="Microsoft YaHei, Arial" font-size="13.6" font-weight="500" text-anchor="start">支部月度跟踪和评价反馈</text>
  <rect x="336" y="344" width="608" height="89.6" rx="14.4" fill="#FFF7ED" stroke="#D4A843" />
  <text x="364.8" y="380.8" fill="#FFFFFF" font-family="Microsoft YaHei, Arial" font-size="19.2" font-weight="900" text-anchor="start">岗位行动</text>
  <text x="364.8" y="409.6" fill="#3B1F1F" font-family="Microsoft YaHei, Arial" font-size="13.6" font-weight="500" text-anchor="start">党员责任区牵引重点任务</text>
  <rect x="240" y="460" width="800" height="89.6" rx="14.4" fill="#FFF7ED" stroke="#D4A843" />
  <text x="268.8" y="496.8" fill="#FFFFFF" font-family="Microsoft YaHei, Arial" font-size="19.2" font-weight="900" text-anchor="start">精神内涵</text>
  <text x="268.8" y="525.6" fill="#3B1F1F" font-family="Microsoft YaHei, Arial" font-size="13.6" font-weight="500" text-anchor="start">统一思想和行动方向</text>
  <rect x="904" y="256" width="264" height="240" rx="14.4" fill="#FFF7ED" stroke="#D4A843" />
  <text x="928" y="297.6" fill="#F8D98A" font-family="Microsoft YaHei, Arial" font-size="19.2" font-weight="800" text-anchor="start">使用提示</text>
  <text x="928" y="339.2" fill="#3B1F1F" font-family="Microsoft YaHei, Arial" font-size="12.8" font-weight="400" text-anchor="start">- 层级要有递进关系</text>
  <text x="928" y="369.6" fill="#3B1F1F" font-family="Microsoft YaHei, Arial" font-size="12.8" font-weight="400" text-anchor="start">- 不把口号当证据</text>
  <text x="928" y="400" fill="#3B1F1F" font-family="Microsoft YaHei, Arial" font-size="12.8" font-weight="400" text-anchor="start">- 底层必须可执行</text>
  <text x="72" y="684.8" fill="#F8D98A" font-family="Microsoft YaHei, Arial" font-size="9.6" font-weight="400" text-anchor="start">示例：党政学习 / 03-pyramid / 来源：模拟业务素材，真实生成时需替换为用户证据</text>
  </svg>