  <text x="490.4" y="329.6" fill="#1E293B" font-family="Microsoft YaHei, Arial" font-size="20" font-weight="900" text-anchor="start">动作</text>
  <text x="490.4" y="372" fill="#334155" font-family="Microsoft YaHei, Arial" font-size="13.6" font-weight="500" text-anchor="start">建立日清单和风险升级</text>
  <text x="490.4" y="416" fill="#334155" font-family="Microsoft YaHei, Arial" font-size="12" font-weight="400" text-anchor="start">- 责任人到人</text>
  <text x="490.4" y="443.2" fill="#334155" font-family="Microsoft YaHei, Arial" font-size="12" font-weight="400" text-anchor="start">- 每日 17 点同步</text>
  <rect x="848" y="240" width="344" height="248" rx="17.6" fill="#FFFFFF" stroke="#E2E8F0" />
