  <text x="102.4" y="288" fill="#F59E0B" font-family="Microsoft YaHei, Arial" font-size="16" font-weight="800" text-anchor="start">背景</text>
  <text x="102.4" y="329.6" fill="#1E293B" font-family="Microsoft YaHei, Arial" font-size="20" font-weight="900" text-anchor="start">场景</text>
  <text x="102.4" y="372" fill="#334155" font-family="Microsoft YaHei, Arial" font-size="13.6" font-weight="500" text-anchor="start">班组连续两周交付延误</text>
  <text x="102.4" y="416" fill="#334155" font-family="Microsoft YaHei, Arial" font-size="12" font-weight="400" text-anchor="start">- 影响客户上线窗口</text>
  <text x="102.4" y="443.2" fill="#334155" font-family="Microsoft YaHei, Arial" font-size="12" font-weight="400" text-anchor="start">- 跨岗位协同不清</text>
  <rect x="460" y="240" width="344" height="248" rx="17.6" fill="#FFFFFF" stroke="#E2E8F0" />
