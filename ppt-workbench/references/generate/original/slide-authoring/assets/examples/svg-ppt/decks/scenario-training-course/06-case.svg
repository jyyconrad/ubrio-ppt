  <text x="878.4" y="329.6" fill="#1E293B" font-family="Microsoft YaHei, Arial" font-size="20" font-weight="900" text-anchor="start">结果</text>
  <text x="878.4" y="372" fill="#334155" font-family="Microsoft YaHei, Arial" font-size="13.6" font-weight="500" text-anchor="start">延误事项逐步收敛</text>
