  <text x="72" y="684.8" fill="#64748B" font-family="Microsoft YaHei, Arial" font-size="9.6" font-weight="400" text-anchor="start">示例：培训课程 / 04-case / 来源：模拟业务素材，真实生成时需替换为用户证据</text>
