<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720"><rect x="0" y="0" width="1280" height="720" fill="#F0F2F5"/><rect x="64" y="40" width="1152" height="52" rx="10" fill="#16233B"/><text x="640" y="73" fill="#FFFFFF" font-family="Microsoft YaHei, Arial" font-size="22" font-weight="700" text-anchor="middle">从问题诊断到改进落地 · 三项流程症结的闭环转化</text><text x="64" y="114" fill="#6B7280" font-family="Microsoft YaHei, Arial" font-size="13.5" text-anchor="start">左栏定位三项流程复盘症结，右栏给出对应改进举措，中心示意从问题域到改进域的转化</text><circle cx="548" cy="402" r="152" fill="#16B98D" fill-opacity="0.62"/><circle cx="744" cy="402" r="152" fill="#2456C8" fill-opacity="0.62"/><text x="496" y="394" fill="#FFFFFF" font-family="Microsoft YaHei, Arial" font-size="26" font-weight="700" text-anchor="middle">问题域</text><text x="496" y="422" fill="#EAFBF4" font-family="Microsoft YaHei, Arial" font-size="13" text-anchor="middle">现状诊断</text><text x="796" y="394" fill="#FFFFFF" font-family="Microsoft YaHei, Arial" font-size="26" font-weight="700" text-anchor="middle">改进域</text><text x="796" y="422" fill="#E7EFFF" font-family="Microsoft YaHei, Arial" font-size="13" text-anchor="middle">整改举措</text><polygon points="622.0,394 646.0,394 646.0,383 676.0,402 646.0,421 646.0,410 622.0,410" fill="#FFFFFF"/><text x="646.0" y="446" fill="#FFFFFF" font-family="Microsoft YaHei, Arial" font-size="13" font-weight="700" text-anchor="middle">转化</text><circle cx="360" cy="282" r="20" fill="#E8F3EE" stroke="#16B98D" stroke-width="2"/><text x="360" y="289" fill="#0E8F6C" font-family="Microsoft YaHei, Arial" font-size="19" font-weight="700" text-anchor="middle">1</text><text x="326" y="268" fill="#16233B" font-family="Microsoft YaHei, Arial" font-size="18.5" font-weight="700" text-anchor="end">响应偏慢</text><text x="326" y="290" fill="#4B5563" font-family="Microsoft YaHei, Arial" font-size="15" text-anchor="end">需求跨部门流转多轮，</text><text x="326" y="310" fill="#4B5563" font-family="Microsoft YaHei, Arial" font-size="15" text-anchor="end">平均响应超两天常误期</text><circle cx="360" cy="402" r="20" fill="#E8F3EE" stroke="#16B98D" stroke-width="2"/><text x="360" y="409" fill="#0E8F6C" font-family="Microsoft YaHei, Arial" font-size="19" font-weight="700" text-anchor="middle">2</text><text x="326" y="388" fill="#16233B" font-family="Microsoft YaHei, Arial" font-size="18.5" font-weight="700" text-anchor="end">沟通分散</text><text x="326" y="410" fill="#4B5563" font-family="Microsoft YaHei, Arial" font-size="15" text-anchor="end">讨论散落多个临时群，</text><text x="326" y="430" fill="#4B5563" font-family="Microsoft YaHei, Arial" font-size="15" text-anchor="end">关键结论难沉淀追溯</text><circle cx="360" cy="522" r="20" fill="#E8F3EE" stroke="#16B98D" stroke-width="2"/><text x="360" y="529" fill="#0E8F6C" font-family="Microsoft YaHei, Arial" font-size="19" font-weight="700" text-anchor="middle">3</text><text x="326" y="508" fill="#16233B" font-family="Microsoft YaHei, Arial" font-size="18.5" font-weight="700" text-anchor="end">口径不一</text><text x="326" y="530" fill="#4B5563" font-family="Microsoft YaHei, Arial" font-size="15" text-anchor="end">各系统指标各算各的，</text><text x="326" y="550" fill="#4B5563" font-family="Microsoft YaHei, Arial" font-size="15" text-anchor="end">报表对不齐难以复用</text><circle cx="932" cy="282" r="20" fill="#E5EDFB" stroke="#2456C8" stroke-width="2"/><text x="932" y="289" fill="#1D3E8F" font-family="Microsoft YaHei, Arial" font-size="19" font-weight="700" text-anchor="middle">1</text><text x="966" y="268" fill="#16233B" font-family="Microsoft YaHei, Arial" font-size="18.5" font-weight="700" text-anchor="start">限时响应</text><text x="966" y="290" fill="#4B5563" font-family="Microsoft YaHei, Arial" font-size="15" text-anchor="start">设对接人与一日SLA，</text><text x="966" y="310" fill="#4B5563" font-family="Microsoft YaHei, Arial" font-size="15" text-anchor="start">响应有承诺可跟踪</text><circle cx="932" cy="402" r="20" fill="#E5EDFB" stroke="#2456C8" stroke-width="2"/><text x="932" y="409" fill="#1D3E8F" font-family="Microsoft YaHei, Arial" font-size="19" font-weight="700" text-anchor="middle">2</text><text x="966" y="388" fill="#16233B" font-family="Microsoft YaHei, Arial" font-size="18.5" font-weight="700" text-anchor="start">例会机制</text><text x="966" y="410" fill="#4B5563" font-family="Microsoft YaHei, Arial" font-size="15" text-anchor="start">建周度对齐例会，</text><text x="966" y="430" fill="#4B5563" font-family="Microsoft YaHei, Arial" font-size="15" text-anchor="start">结论当场归档同步</text><circle cx="932" cy="522" r="20" fill="#E5EDFB" stroke="#2456C8" stroke-width="2"/><text x="932" y="529" fill="#1D3E8F" font-family="Microsoft YaHei, Arial" font-size="19" font-weight="700" text-anchor="middle">3</text><text x="966" y="508" fill="#16233B" font-family="Microsoft YaHei, Arial" font-size="18.5" font-weight="700" text-anchor="start">统一口径</text><text x="966" y="530" fill="#4B5563" font-family="Microsoft YaHei, Arial" font-size="15" text-anchor="start">建指标字典单一数据源，</text><text x="966" y="550" fill="#4B5563" font-family="Microsoft YaHei, Arial" font-size="15" text-anchor="start">报表自动对齐可追</text></svg>