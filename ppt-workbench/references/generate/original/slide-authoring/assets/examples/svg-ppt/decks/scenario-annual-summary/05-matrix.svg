  <g id="annual-gap-principle">
  <rect x="904" y="281.6" width="305.6" height="299.2" rx="14.4" fill="#0F3B73" stroke="#0F3B73" />
  <text x="928" y="315.2" fill="#FFFFFF" font-family="Microsoft YaHei, Arial" font-size="16.8" font-weight="900" text-anchor="start">诊断页写法</text>
  <text x="928" y="355.2" fill="#EAF3FF" font-family="Microsoft YaHei, Arial" font-size="11.2" font-weight="800" text-anchor="start">1. 每个问题必须有影响等级。</text>
  <text x="928" y="385.6" fill="#EAF3FF" font-family="Microsoft YaHei, Arial" font-size="11.2" font-weight="800" text-anchor="start">2. 每个差距必须写来源或口径。</text>
  <text x="928" y="416" fill="#EAF3FF" font-family="Microsoft YaHei, Arial" font-size="11.2" font-weight="800" text-anchor="start">3. 每个动作必须绑定Owner。</text>
  <text x="928" y="446.4" fill="#EAF3FF" font-family="Microsoft YaHei, Arial" font-size="11.2" font-weight="800" text-anchor="start">4. 不写“继续加强、持续推进”。</text>
  <text x="928" y="476.8" fill="#EAF3FF" font-family="Microsoft YaHei, Arial" font-size="11.2" font-weight="800" text-anchor="start">5. 低优先问题也要说明复盘节奏。</text>
  <rect x="928" y="528" width="241.6" height="32" rx="14.4" fill="#F59E0B" stroke="#F59E0B" />
  <text x="947.2" y="548.8" fill="#FFFFFF" font-family="Microsoft YaHei, Arial" font-size="10.4" font-weight="900" text-anchor="start">矩阵不是装饰，是整改优先级</text>
