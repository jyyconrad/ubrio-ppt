<polygon points="1058,348 1070,360 1058,372 1054,372 1066,360 1054,348" fill="#93A8BE"/>
<text x="1058" y="392" fill="#6B7280" font-family="Microsoft YaHei, Arial" font-size="11.5" text-anchor="middle">增值</text>
