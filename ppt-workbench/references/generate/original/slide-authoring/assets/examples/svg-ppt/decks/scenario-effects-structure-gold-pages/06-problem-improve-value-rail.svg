<text x="72" y="673" fill="#9FC0FF" font-family="Microsoft YaHei, Arial" font-size="15" font-weight="700">整改承诺</text>
<text x="168" y="673" fill="#FFFFFF" font-family="Microsoft YaHei, Arial" font-size="14.5">三项症结逐项挂责任人，周度复盘追踪到人，季度末回看整改成效</text>
<text x="1208" y="673" fill="#9FC0FF" font-family="Microsoft YaHei, Arial" font-size="14" font-weight="700" text-anchor="end">两季度内闭环</text>
