<text x="1090" y="254" fill="#31414F" font-family="Microsoft YaHei, Arial" font-size="14">线索成交更快</text>
<rect x="1070" y="310" width="162" height="148" rx="14" fill="#FFFFFF" stroke="#D6DEEA" stroke-width="1"/>
<polygon points="1090,348 1106,348 1098,332" fill="#2456C8"/>
<text x="1090" y="390" fill="#1D3E8F" font-family="Microsoft YaHei, Arial" font-size="18" font-weight="700">交付提速</text>
<text x="1090" y="418" fill="#31414F" font-family="Microsoft YaHei, Arial" font-size="14">周期缩短三成</text>
<rect x="1070" y="474" width="162" height="148" rx="14" fill="#FFFFFF" stroke="#D6DEEA" stroke-width="1"/>
<polygon points="1090,512 1106,512 1098,496" fill="#2456C8"/>
<text x="1090" y="554" fill="#1D3E8F" font-family="Microsoft YaHei, Arial" font-size="18" font-weight="700">口碑回升</text>
<text x="1090" y="582" fill="#31414F" font-family="Microsoft YaHei, Arial" font-size="14">满意重回高位</text>
<polygon points="503,348 515,360 503,372 499,372 511,360 499,348" fill="#B4C6D8"/>
<polygon points="513,348 525,360 513,372 509,372 521,360 509,348" fill="#93A8BE"/>
