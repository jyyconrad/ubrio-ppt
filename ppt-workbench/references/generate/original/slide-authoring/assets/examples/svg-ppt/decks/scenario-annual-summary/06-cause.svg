<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect x="0" y="0" width="1280" height="720" fill="#F6F8FB" />
  <text x="70.4" y="19.2" fill="#64748B" font-family="Microsoft YaHei, Arial" font-size="12" font-weight="600" text-anchor="start">年度经营总结 / 经营复盘 / SVG-PPT 高密度示例</text>
  <text x="70.4" y="92.8" fill="#0F172A" font-family="Microsoft YaHei, Arial" font-size="30.4" font-weight="900" text-anchor="start">原因分析：增长不是单点动作，而是三类机制共同作用</text>
  <text x="70.4" y="128" fill="#334155" font-family="Microsoft YaHei, Arial" font-size="14.4" font-weight="500" text-anchor="start">左侧给判断，右侧用证据链支撑。</text>
  <rect x="70.4" y="148.8" width="1139.2" height="33.6" rx="14.4" fill="#EFF6FF" stroke="#B8D8FF" />
  <text x="92.8" y="170.4" fill="#0F172A" font-family="Microsoft YaHei, Arial" font-size="12" font-weight="700" text-anchor="start">页面合同：年度总结必须同时写结果、差距、原因、证据口径和来年动作；缺数据时标缺口，不删问题。</text>
  <g id="annual-cause-claim">
  <rect x="70.4" y="200" width="400" height="272" rx="17.6" fill="#0F3B73" stroke="#0F3B73" />
  <text x="100.8" y="244.8" fill="#FFFFFF" font-family="Microsoft YaHei, Arial" font-size="19.2" font-weight="900" text-anchor="start">核心判断</text>
  <text x="100.8" y="289.6" fill="#EAF3FF" font-family="Microsoft YaHei, Arial" font-size="13.6" font-weight="800" text-anchor="start">收入增长不是销售单点冲刺，</text>
  <text x="100.8" y="320" fill="#EAF3FF" font-family="Microsoft YaHei, Arial" font-size="13.6" font-weight="800" text-anchor="start">而是行业选择、交付机制、</text>
  <text x="100.8" y="350.4" fill="#EAF3FF" font-family="Microsoft YaHei, Arial" font-size="13.6" font-weight="800" text-anchor="start">复购运营三类机制共同作用。</text>
  <text x="100.8" y="380.8" fill="#EAF3FF" font-family="Microsoft YaHei, Arial" font-size="13.6" font-weight="800" text-anchor="start">短板也来自这三类机制没有闭环。</text>
  <rect x="100.8" y="422.4" width="278.4" height="30.4" rx="15.2" fill="#F59E0B" stroke="#F59E0B" />
  <text x="120" y="442.4" fill="#FFFFFF" font-family="Microsoft YaHei, Arial" font-size="11.2" font-weight="900" text-anchor="start">结论：机制解释优先于功劳罗列</text>
  <text x="120" y="465.6" fill="#EAF3FF" font-family="Microsoft YaHei, Arial" font-size="8.8" font-weight="800" text-anchor="start">素材口径：CRM + PMO + 客成三表共同解释</text>
  </g>
  <g id="annual-cause-evidence">
  <rect x="520" y="200" width="689.6" height="81.6" rx="12.8" fill="#FFFFFF" stroke="#D9E2EC" />
  <text x="547.2" y="227.2" fill="#2563EB" font-family="Microsoft YaHei, Arial" font-size="16" font-weight="900" text-anchor="start">行业选择</text>
  <text x="672" y="227.2" fill="#0F172A" font-family="Microsoft YaHei, Arial" font-size="13.6" font-weight="900" text-anchor="start">重点行业需求更确定</text>
  <text x="547.2" y="252.8" fill="#334155" font-family="Microsoft YaHei, Arial" font-size="10.4" font-weight="700" text-anchor="start">预算明确、客户集中、案例可复制</text>
  <text x="547.2" y="272" fill="#64748B" font-family="Microsoft YaHei, Arial" font-size="9.6" font-weight="600" text-anchor="start">证据：CRM合同清单</text>
  <text x="1008" y="272" fill="#2563EB" font-family="Microsoft YaHei, Arial" font-size="9.6" font-weight="900" text-anchor="start">销售战区</text>
  <text x="830.4" y="252.8" fill="#2563EB" font-family="Microsoft YaHei, Arial" font-size="9.6" font-weight="800" text-anchor="start">解释：结构优化来自行业深耕</text>
  <rect x="1102.4" y="214.4" width="83.2" height="19.2" rx="9.6" fill="#FFFFFF" stroke="#2563EB" />
  <text x="1113.6" y="228" fill="#2563EB" font-family="Microsoft YaHei, Arial" font-size="8" font-weight="900" text-anchor="start">Owner</text>
  <rect x="1102.4" y="241.6" width="83.2" height="19.2" rx="9.6" fill="#FFFFFF" stroke="#2563EB" />
  <text x="1113.6" y="255.2" fill="#2563EB" font-family="Microsoft YaHei, Arial" font-size="8" font-weight="900" text-anchor="start">证据</text>
  <rect x="520" y="305.6" width="689.6" height="81.6" rx="12.8" fill="#FFFFFF" stroke="#D9E2EC" />
  <text x="547.2" y="332.8" fill="#2563EB" font-family="Microsoft YaHei, Arial" font-size="16" font-weight="900" text-anchor="start">交付机制</text>
  <text x="672" y="332.8" fill="#0F172A" font-family="Microsoft YaHei, Arial" font-size="13.6" font-weight="900" text-anchor="start">联合评审降低返工</text>
  <text x="547.2" y="358.4" fill="#334155" font-family="Microsoft YaHei, Arial" font-size="10.4" font-weight="700" text-anchor="start">售前/交付/运营同评审，风险进周会</text>
  <text x="547.2" y="377.6" fill="#64748B" font-family="Microsoft YaHei, Arial" font-size="9.6" font-weight="600" text-anchor="start">证据：PMO项目台账</text>
  <text x="1008" y="377.6" fill="#2563EB" font-family="Microsoft YaHei, Arial" font-size="9.6" font-weight="900" text-anchor="start">交付PMO</text>
  <text x="830.4" y="358.4" fill="#2563EB" font-family="Microsoft YaHei, Arial" font-size="9.6" font-weight="800" text-anchor="start">动作：把里程碑看板固化</text>
  <rect x="1102.4" y="320" width="83.2" height="19.2" rx="9.6" fill="#FFFFFF" stroke="#2563EB" />
  <text x="1113.6" y="333.6" fill="#2563EB" font-family="Microsoft YaHei, Arial" font-size="8" font-weight="900" text-anchor="start">Owner</text>
  <rect x="1102.4" y="347.2" width="83.2" height="19.2" rx="9.6" fill="#FFFFFF" stroke="#2563EB" />
  <text x="1113.6" y="360.8" fill="#2563EB" font-family="Microsoft YaHei, Arial" font-size="8" font-weight="900" text-anchor="start">证据</text>
  <rect x="520" y="411.2" width="689.6" height="81.6" rx="12.8" fill="#FFFFFF" stroke="#D9E2EC" />
  <text x="547.2" y="438.4" fill="#B91C1C" font-family="Microsoft YaHei, Arial" font-size="16" font-weight="900" text-anchor="start">复购运营</text>
  <text x="672" y="438.4" fill="#0F172A" font-family="Microsoft YaHei, Arial" font-size="13.6" font-weight="900" text-anchor="start">客户价值挖掘不足</text>
  <text x="547.2" y="464" fill="#334155" font-family="Microsoft YaHei, Arial" font-size="10.4" font-weight="700" text-anchor="start">分层策略缺动作闭环，续约金额待补</text>
  <text x="547.2" y="483.2" fill="#64748B" font-family="Microsoft YaHei, Arial" font-size="9.6" font-weight="600" text-anchor="start">证据：客户成功台账</text>
  <text x="1008" y="483.2" fill="#B91C1C" font-family="Microsoft YaHei, Arial" font-size="9.6" font-weight="900" text-anchor="start">客户成功</text>
  <text x="830.4" y="464" fill="#B91C1C" font-family="Microsoft YaHei, Arial" font-size="9.6" font-weight="800" text-anchor="start">风险：复购口径仍待补</text>
  <rect x="1102.4" y="425.6" width="83.2" height="19.2" rx="9.6" fill="#FFFFFF" stroke="#B91C1C" />
  <text x="1113.6" y="439.2" fill="#B91C1C" font-family="Microsoft YaHei, Arial" font-size="8" font-weight="900" text-anchor="start">Owner</text>
  <rect x="1102.4" y="452.8" width="83.2" height="19.2" rx="9.6" fill="#FFFFFF" stroke="#B91C1C" />
  <text x="1113.6" y="466.4" fill="#B91C1C" font-family="Microsoft YaHei, Arial" font-size="8" font-weight="900" text-anchor="start">证据</text>
  </g>
  <g id="annual-cause-closure">
  <rect x="70.4" y="488" width="256" height="46.4" rx="11.2" fill="#EFF6FF" stroke="#B8D8FF" />
  <text x="84.8" y="506.4" fill="#2563EB" font-family="Microsoft YaHei, Arial" font-size="9.6" font-weight="900" text-anchor="start">原因</text>
  <text x="131.2" y="506.4" fill="#0F172A" font-family="Microsoft YaHei, Arial" font-size="9.6" font-weight="800" text-anchor="start">行业选择</text>
  <text x="84.8" y="524.8" fill="#334155" font-family="Microsoft YaHei, Arial" font-size="8.8" font-weight="600" text-anchor="start">用CRM合同清单证明</text>
  <rect x="355.2" y="488" width="256" height="46.4" rx="11.2" fill="#EFF6FF" stroke="#B8D8FF" />
  <text x="369.6" y="506.4" fill="#2563EB" font-family="Microsoft YaHei, Arial" font-size="9.6" font-weight="900" text-anchor="start">原因</text>
  <text x="416" y="506.4" fill="#0F172A" font-family="Microsoft YaHei, Arial" font-size="9.6" font-weight="800" text-anchor="start">交付机制</text>
  <text x="369.6" y="524.8" fill="#334155" font-family="Microsoft YaHei, Arial" font-size="8.8" font-weight="600" text-anchor="start">用PMO台账解释效率</text>
  <rect x="640" y="488" width="256" height="46.4" rx="11.2" fill="#EFF6FF" stroke="#B8D8FF" />
  <text x="654.4" y="506.4" fill="#2563EB" font-family="Microsoft YaHei, Arial" font-size="9.6" font-weight="900" text-anchor="start">风险</text>
  <text x="700.8" y="506.4" fill="#0F172A" font-family="Microsoft YaHei, Arial" font-size="9.6" font-weight="800" text-anchor="start">复购运营</text>
  <text x="654.4" y="524.8" fill="#334155" font-family="Microsoft YaHei, Arial" font-size="8.8" font-weight="600" text-anchor="start">用客户成功台账补口径</text>
  <rect x="924.8" y="488" width="256" height="46.4" rx="11.2" fill="#EFF6FF" stroke="#B8D8FF" />
  <text x="939.2" y="506.4" fill="#2563EB" font-family="Microsoft YaHei, Arial" font-size="9.6" font-weight="900" text-anchor="start">承接</text>
  <text x="985.6" y="506.4" fill="#0F172A" font-family="Microsoft YaHei, Arial" font-size="9.6" font-weight="800" text-anchor="start">来年抓手</text>
  <text x="939.2" y="524.8" fill="#334155" font-family="Microsoft YaHei, Arial" font-size="8.8" font-weight="600" text-anchor="start">转成季度动作和Owner</text>
  <text x="118.4" y="552" fill="#2563EB" font-family="Microsoft YaHei, Arial" font-size="8" font-weight="900" text-anchor="start">解释结果</text>
  <text x="403.2" y="552" fill="#2563EB" font-family="Microsoft YaHei, Arial" font-size="8" font-weight="900" text-anchor="start">解释差距</text>
  <text x="688" y="552" fill="#2563EB" font-family="Microsoft YaHei, Arial" font-size="8" font-weight="900" text-anchor="start">转成动作</text>
  <text x="972.8" y="552" fill="#2563EB" font-family="Microsoft YaHei, Arial" font-size="8" font-weight="900" text-anchor="start">进入复盘</text>
  <rect x="70.4" y="563.2" width="1139.2" height="46.4" rx="12.8" fill="#EFF6FF" stroke="#B8D8FF" />
  <text x="94.4" y="590.4" fill="#0F172A" font-family="Microsoft YaHei, Arial" font-size="12" font-weight="800" text-anchor="start">原因页合同：原因必须能解释结果和差距，并且能转成来年抓手；不能写“市场环境、团队努力”这类不可执行归因。</text>
  <rect x="70.4" y="633.6" width="1139.2" height="27.2" rx="11.2" fill="#0F3B73" stroke="#0F3B73" />
  <text x="94.4" y="652" fill="#FFFFFF" font-family="Microsoft YaHei, Arial" font-size="10.4" font-weight="900" text-anchor="start">下一页承接：把三类机制拆成 Q1-Q4 行动和验收口径。</text>
  </g>
  <text x="70.4" y="676.8" fill="#64748B" font-family="Microsoft YaHei, Arial" font-size="9.6" font-weight="500" text-anchor="start">素材：年度财务月报 / CRM 商机与合同清单 / 交付 PMO 台账 / 客户成功复购台账</text>
  <text x="992" y="676.8" fill="#64748B" font-family="Microsoft YaHei, Arial" font-size="9.6" font-weight="500" text-anchor="start">年度经营总结 / 06-cause</text>
  </svg>