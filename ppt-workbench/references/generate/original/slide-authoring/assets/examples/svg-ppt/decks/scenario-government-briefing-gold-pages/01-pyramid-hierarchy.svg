<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="gAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1E4FCC"/><stop offset="1" stop-color="#4A8CFF"/>
    </linearGradient>
    <linearGradient id="gTitleBar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4A8CFF"/><stop offset="1" stop-color="#1E4FCC"/>
    </linearGradient>
    <linearGradient id="gBand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0E2A66"/><stop offset="0.55" stop-color="#173C86"/><stop offset="1" stop-color="#1E4FCC"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#123A8C" flood-opacity="0.16"/>
    </filter>
  </defs>

  <!-- 离线预览底色：仅供 rsvg 预览。运行时整页背景由 deck_framework.background 承载；
       提交 render_svg_drawingml_slide 的内容层 SVG 不要照抄这行整页 rect，
       否则触发 SVG_FULL_PAGE_BACKGROUND_FORBIDDEN。 -->
  <rect x="0" y="0" width="1280" height="720" fill="#F4F7FC"/>

  <!-- 标题区 -->
  <text x="66" y="58" fill="#1D6FFF" font-family="Microsoft YaHei, Arial" font-size="15" font-weight="700">集团智能体平台 · 分层能力体系</text>
  <rect x="64" y="70" width="10" height="34" rx="4" fill="url(#gTitleBar)"/>
  <text x="88" y="98" fill="#123A8C" font-family="Microsoft YaHei, Arial" font-size="37" font-weight="800">统一入口、分级落地、持续创新</text>
  <rect x="64" y="114" width="200" height="5" rx="2.5" fill="url(#gAccent)"/>
  <rect x="272" y="116" width="944" height="2" rx="1" fill="#C9D9F2"/>
  <text x="64" y="142" fill="#4A5E7C" font-family="Microsoft YaHei, Arial" font-size="15.5" font-weight="600">智能体平台的价值不在数量，而在于从通用入口、专业能力、业务闭环到创新扩散的四层体系。</text>

  <!-- 上下文条：3 指标 pill + 高价值场景环形徽章 -->
  <g filter="url(#softShadow)">
    <rect x="64" y="158" width="264" height="60" rx="10" fill="#FFFFFF"/>
    <rect x="64" y="158" width="264" height="5" rx="2.5" fill="url(#gAccent)"/>
  </g>
  <text x="84" y="200" fill="#1D6FFF" font-family="Microsoft YaHei, Arial" font-size="27" font-weight="800">4层</text>
  <text x="150" y="187" fill="#33445C" font-family="Microsoft YaHei, Arial" font-size="13.5" font-weight="700">能力层级</text>
  <text x="150" y="207" fill="#8595AB" font-family="Microsoft YaHei, Arial" font-size="11">通用 / 专业 / 业务 / 创新</text>

  <g filter="url(#softShadow)">
    <rect x="348" y="158" width="264" height="60" rx="10" fill="#FFFFFF"/>
    <rect x="348" y="158" width="264" height="5" rx="2.5" fill="url(#gAccent)"/>
  </g>
  <text x="368" y="200" fill="#1D6FFF" font-family="Microsoft YaHei, Arial" font-size="27" font-weight="800">3类</text>
  <text x="434" y="187" fill="#33445C" font-family="Microsoft YaHei, Arial" font-size="13.5" font-weight="700">价值方向</text>
  <text x="434" y="207" fill="#8595AB" font-family="Microsoft YaHei, Arial" font-size="11">全员提效 / 专业提质 / 流程闭环</text>

  <g filter="url(#softShadow)">
    <rect x="632" y="158" width="264" height="60" rx="10" fill="#FFFFFF"/>
    <rect x="632" y="158" width="264" height="5" rx="2.5" fill="url(#gAccent)"/>
  </g>
  <text x="652" y="199" fill="#1D6FFF" font-family="Microsoft YaHei, Arial" font-size="22" font-weight="800">平台化</text>
  <text x="738" y="187" fill="#33445C" font-family="Microsoft YaHei, Arial" font-size="13.5" font-weight="700">治理方式</text>
  <text x="738" y="207" fill="#8595AB" font-family="Microsoft YaHei, Arial" font-size="11">创建 · 运营 · 复用 · 推广</text>

  <g filter="url(#softShadow)">
    <rect x="916" y="158" width="300" height="60" rx="10" fill="#EDF3FE"/>
  </g>
  <rect x="916" y="158" width="4" height="60" rx="2" fill="url(#gAccent)"/>
  <circle cx="952" cy="188" r="23" fill="none" stroke="#D7E3F7" stroke-width="6"/>
  <circle cx="952" cy="188" r="23" fill="none" stroke="url(#gAccent)" stroke-width="6" stroke-linecap="round" stroke-dasharray="115.6 28.9" transform="rotate(-90 952 188)"/>
  <text x="952" y="195" fill="#123A8C" font-family="Microsoft YaHei, Arial" font-size="19" font-weight="800" text-anchor="middle">40</text>
  <text x="988" y="184" fill="#123A8C" font-family="Microsoft YaHei, Arial" font-size="14" font-weight="700">个高价值场景</text>
  <text x="988" y="205" fill="#64748B" font-family="Microsoft YaHei, Arial" font-size="11">集团场景库 · 场景工厂底座</text>

  <!-- 主体：左侧四层金字塔（自下而上渐深）+ 右侧四张引出说明卡 -->
  <polygon points="160,236 340,236 366,326 134,326" fill="#0E2A66"/>
  <polygon points="132,334 368,334 394,424 106,424" fill="#1B4DB8"/>
  <polygon points="104,432 396,432 422,522 78,522" fill="#2E6BDF"/>
  <polygon points="76,530 424,530 450,620 50,620" fill="#4A8CFF"/>

  <text x="250" y="277" fill="#FFFFFF" font-family="Microsoft YaHei, Arial" font-size="16.5" font-weight="800" text-anchor="middle">④ 创新型智能体</text>
  <text x="250" y="299" fill="#BBD2FF" font-family="Microsoft YaHei, Arial" font-size="11.5" text-anchor="middle">自主创新 · 创新扩散</text>
  <text x="250" y="375" fill="#FFFFFF" font-family="Microsoft YaHei, Arial" font-size="16.5" font-weight="800" text-anchor="middle">③ 业务智能体</text>
  <text x="250" y="397" fill="#CFE0FF" font-family="Microsoft YaHei, Arial" font-size="11.5" text-anchor="middle">核心流程 · 端到端闭环</text>
  <text x="250" y="473" fill="#FFFFFF" font-family="Microsoft YaHei, Arial" font-size="16.5" font-weight="800" text-anchor="middle">② 专业智能体</text>
  <text x="250" y="495" fill="#DCE8FF" font-family="Microsoft YaHei, Arial" font-size="11.5" text-anchor="middle">岗位经验 · 沉淀复用</text>
  <text x="250" y="571" fill="#FFFFFF" font-family="Microsoft YaHei, Arial" font-size="16.5" font-weight="800" text-anchor="middle">① 通用智能体</text>
  <text x="250" y="593" fill="#EAF2FF" font-family="Microsoft YaHei, Arial" font-size="11.5" font-weight="600" text-anchor="middle">人人可用 · 全员入口</text>

  <!-- 金字塔方向轴：自下而上渐深 -->
  <path d="M 40 620 L 40 236" stroke="#B9C9E4" stroke-width="1.4"/>
  <path d="M 40 236 L 36 246 M 40 236 L 44 246" stroke="#1D6FFF" stroke-width="1.6" fill="none"/>
  <text x="30" y="428" fill="#8595AB" font-family="Microsoft YaHei, Arial" font-size="11" transform="rotate(-90 30 428)" text-anchor="middle">全员入口 → 创新扩散</text>

  <!-- 引出连接线 + 节点 -->
  <line x1="360" y1="281" x2="486" y2="281" stroke="#0E2A66" stroke-width="1.6" stroke-dasharray="2 3"/>
  <circle cx="486" cy="281" r="4" fill="#0E2A66"/>
  <line x1="386" y1="379" x2="486" y2="379" stroke="#1B4DB8" stroke-width="1.6" stroke-dasharray="2 3"/>
  <circle cx="486" cy="379" r="4" fill="#1B4DB8"/>
  <line x1="412" y1="477" x2="486" y2="477" stroke="#2E6BDF" stroke-width="1.6" stroke-dasharray="2 3"/>
  <circle cx="486" cy="477" r="4" fill="#2E6BDF"/>
  <line x1="440" y1="575" x2="486" y2="575" stroke="#4A8CFF" stroke-width="1.6" stroke-dasharray="2 3"/>
  <circle cx="486" cy="575" r="4" fill="#4A8CFF"/>

  <!-- 说明卡 1：创新型（顶） -->
  <g filter="url(#softShadow)"><rect x="490" y="236" width="726" height="90" rx="11" fill="#FFFFFF"/></g>
  <rect x="490" y="236" width="6" height="90" rx="3" fill="#0E2A66"/>
  <text x="514" y="266" fill="#123A8C" font-family="Microsoft YaHei, Arial" font-size="15.5" font-weight="700">自主创新 · 沉淀复用｜面向全员创新</text>
  <rect x="1156" y="250" width="46" height="22" rx="11" fill="#EDF3FE"/>
  <text x="1179" y="265" fill="#1D6FFF" font-family="Microsoft YaHei, Arial" font-size="11.5" font-weight="700" text-anchor="middle">L4</text>
  <text x="514" y="290" fill="#33445C" font-family="Microsoft YaHei, Arial" font-size="13">平台吸纳沉淀 / 共享复用 / 集团内推广 / 知识工程回流</text>
  <text x="514" y="313" fill="#1D6FFF" font-family="Microsoft YaHei, Arial" font-size="13" font-weight="700">▸ 打造集团级创新平台，加速能力推广与价值创造</text>

  <!-- 说明卡 2：业务 -->
  <g filter="url(#softShadow)"><rect x="490" y="334" width="726" height="90" rx="11" fill="#FFFFFF"/></g>
  <rect x="490" y="334" width="6" height="90" rx="3" fill="#1B4DB8"/>
  <text x="514" y="364" fill="#123A8C" font-family="Microsoft YaHei, Arial" font-size="15.5" font-weight="700">业务流程 · 端到端｜面向核心业务</text>
  <rect x="1156" y="348" width="46" height="22" rx="11" fill="#EDF3FE"/>
  <text x="1179" y="363" fill="#1D6FFF" font-family="Microsoft YaHei, Arial" font-size="11.5" font-weight="700" text-anchor="middle">L3</text>
  <text x="514" y="388" fill="#33445C" font-family="Microsoft YaHei, Arial" font-size="13">场景诊断 / 系统接入 / 试运行 / 业务 SOP 重构（专家团队贴身服务）</text>
  <text x="514" y="411" fill="#1D6FFF" font-family="Microsoft YaHei, Arial" font-size="13" font-weight="700">▸ 把核心流程做成闭环，支撑核心业务自动化</text>

  <!-- 说明卡 3：专业 -->
  <g filter="url(#softShadow)"><rect x="490" y="432" width="726" height="90" rx="11" fill="#FFFFFF"/></g>
  <rect x="490" y="432" width="6" height="90" rx="3" fill="#2E6BDF"/>
  <text x="514" y="462" fill="#123A8C" font-family="Microsoft YaHei, Arial" font-size="15.5" font-weight="700">专业能力 · 持续陪跑｜面向专业岗位</text>
  <rect x="1156" y="446" width="46" height="22" rx="11" fill="#EDF3FE"/>
  <text x="1179" y="461" fill="#1D6FFF" font-family="Microsoft YaHei, Arial" font-size="11.5" font-weight="700" text-anchor="middle">L2</text>
  <text x="514" y="486" fill="#33445C" font-family="Microsoft YaHei, Arial" font-size="13">岗位订阅 / 角色授权 / 模板配置 / 陪跑运营（法务·财税·供应链·合规·投研）</text>
  <text x="514" y="509" fill="#1D6FFF" font-family="Microsoft YaHei, Arial" font-size="13" font-weight="700">▸ 把岗位经验沉淀成可复用能力，提升专业质量与效率</text>

  <!-- 说明卡 4：通用（底） -->
  <g filter="url(#softShadow)"><rect x="490" y="530" width="726" height="90" rx="11" fill="#FFFFFF"/></g>
  <rect x="490" y="530" width="6" height="90" rx="3" fill="#4A8CFF"/>
  <text x="514" y="560" fill="#123A8C" font-family="Microsoft YaHei, Arial" font-size="15.5" font-weight="700">日常办公 · 开箱即用｜面向全员</text>
  <rect x="1156" y="544" width="46" height="22" rx="11" fill="#EDF3FE"/>
  <text x="1179" y="559" fill="#1D6FFF" font-family="Microsoft YaHei, Arial" font-size="11.5" font-weight="700" text-anchor="middle">L1</text>
  <text x="514" y="584" fill="#33445C" font-family="Microsoft YaHei, Arial" font-size="13">专业写作 / 会议纪要 / 制度问答 / 数据洞察 / 知识检索 / 深度研究</text>
  <text x="514" y="607" fill="#1D6FFF" font-family="Microsoft YaHei, Arial" font-size="13" font-weight="700">▸ 覆盖全员办公提效，形成企业 AI 使用人口</text>

  <!-- 底部结论带 -->
  <g filter="url(#softShadow)"><rect x="64" y="648" width="1152" height="42" rx="10" fill="url(#gBand)"/></g>
  <text x="640" y="674" fill="#FFFFFF" font-family="Microsoft YaHei, Arial" font-size="15.5" font-weight="700" text-anchor="middle">平台不是堆“工具”，而是构建从全员入口 → 场景闭环 → 创新扩散的智能体生产体系，支撑集团数字化转型升级</text>

  <!-- 结构参考标注 -->
  <text x="64" y="712" fill="#9B8AAE" font-family="Microsoft YaHei, Arial" font-size="11">示例数据 · 仅供 layout-pyramid-hierarchy 结构参考，真实生成需替换为用户证据</text>
</svg>
