<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect x="0" y="0" width="1280" height="720" fill="#F6F8FB" />
  <text x="72" y="70.4" fill="#64748B" font-family="Microsoft YaHei, Arial" font-size="14.4" font-weight="500" text-anchor="start">产品发布 / content</text>
  <text x="72" y="113.6" fill="#0F172A" font-family="Microsoft YaHei, Arial" font-size="33.6" font-weight="800" text-anchor="start">用户旅程：断点出现在会议后、执行中和复盘时</text>
  <text x="72" y="155.2" fill="#334155" font-family="Microsoft YaHei, Arial" font-size="16" font-weight="400" text-anchor="start">发布页先讲用户痛点，不先堆功能。</text>
  <line x1="120" y1="376" x2="1160" y2="376" stroke="#D9E2EC" stroke-width="4.8" />
  <circle cx="137.6" cy="376" r="20.8" fill="#1A3A6B" />
  <text x="137.6" y="383.2" fill="#FFFFFF" font-family="Microsoft YaHei, Arial" font-size="16" font-weight="800" text-anchor="middle">1</text>
  <rect x="104" y="228" width="240" height="148" rx="14.4" fill="#FFFFFF" stroke="#D9E2EC" />
  <text x="123.2" y="264.8" fill="#0F172A" font-family="Microsoft YaHei, Arial" font-size="18.4" font-weight="800" text-anchor="start">会议后</text>
  <text x="123.2" y="296" fill="#334155" font-family="Microsoft YaHei, Arial" font-size="12.8" font-weight="500" text-anchor="start">纪要无法直接变任务</text>
  <text x="123.2" y="326.4" fill="#334155" font-family="Microsoft YaHei, Arial" font-size="11.2" font-weight="400" text-anchor="start">- 责任人和时间易丢失</text>
  <circle cx="405.6" cy="376" r="20.8" fill="#1A3A6B" />
  <text x="405.6" y="383.2" fill="#FFFFFF" font-family="Microsoft YaHei, Arial" font-size="16" font-weight="800" text-anchor="middle">2</text>
  <rect x="372" y="432" width="240" height="148" rx="14.4" fill="#FFFFFF" stroke="#D9E2EC" />
  <text x="391.2" y="468.8" fill="#0F172A" font-family="Microsoft YaHei, Arial" font-size="18.4" font-weight="800" text-anchor="start">执行中</text>
  <text x="391.2" y="500" fill="#334155" font-family="Microsoft YaHei, Arial" font-size="12.8" font-weight="500" text-anchor="start">管理者看不到进展</text>
  <text x="391.2" y="530.4" fill="#334155" font-family="Microsoft YaHei, Arial" font-size="11.2" font-weight="400" text-anchor="start">- 多项目状态分散</text>
  <circle cx="673.6" cy="376" r="20.8" fill="#1A3A6B" />
  <text x="673.6" y="383.2" fill="#FFFFFF" font-family="Microsoft YaHei, Arial" font-size="16" font-weight="800" text-anchor="middle">3</text>
  <rect x="640" y="228" width="240" height="148" rx="14.4" fill="#FFFFFF" stroke="#D9E2EC" />
  <text x="659.2" y="264.8" fill="#0F172A" font-family="Microsoft YaHei, Arial" font-size="18.4" font-weight="800" text-anchor="start">协同中</text>
  <text x="659.2" y="296" fill="#334155" font-family="Microsoft YaHei, Arial" font-size="12.8" font-weight="500" text-anchor="start">跨部门依赖不透明</text>
  <text x="659.2" y="326.4" fill="#334155" font-family="Microsoft YaHei, Arial" font-size="11.2" font-weight="400" text-anchor="start">- 风险不能及时升级</text>
  <circle cx="941.6" cy="376" r="20.8" fill="#1A3A6B" />
  <text x="941.6" y="383.2" fill="#FFFFFF" font-family="Microsoft YaHei, Arial" font-size="16" font-weight="800" text-anchor="middle">4</text>
  <rect x="908" y="432" width="240" height="148" rx="14.4" fill="#FFFFFF" stroke="#D9E2EC" />
  <text x="927.2" y="468.8" fill="#0F172A" font-family="Microsoft YaHei, Arial" font-size="18.4" font-weight="800" text-anchor="start">复盘时</text>
  <text x="927.2" y="500" fill="#334155" font-family="Microsoft YaHei, Arial" font-size="12.8" font-weight="500" text-anchor="start">经验难沉淀为模板</text>
  <text x="927.2" y="530.4" fill="#334155" font-family="Microsoft YaHei, Arial" font-size="11.2" font-weight="400" text-anchor="start">- 下一次仍从零开始</text>
  <text x="72" y="684.8" fill="#64748B" font-family="Microsoft YaHei, Arial" font-size="9.6" font-weight="400" text-anchor="start">示例：产品发布 / 02-pain-journey / 来源：模拟业务素材，真实生成时需替换为用户证据</text>
  </svg>