  <text x="918.4" y="478.4" fill="#F59E0B" font-family="Microsoft YaHei, Arial" font-size="12" font-weight="700" text-anchor="start">能力三</text>
  <text x="72" y="684.8" fill="#64748B" font-family="Microsoft YaHei, Arial" font-size="9.6" font-weight="400" text-anchor="start">示例：培训课程 / 02-objectives / 来源：模拟业务素材，真实生成时需替换为用户证据</text>
