<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect x="0" y="0" width="1280" height="720" fill="#F8FAFC" />
  <text x="72" y="70.4" fill="#64748B" font-family="Microsoft YaHei, Arial" font-size="14.4" font-weight="500" text-anchor="start">培训课程 / content</text>
  <text x="72" y="113.6" fill="#1E293B" font-family="Microsoft YaHei, Arial" font-size="33.6" font-weight="800" text-anchor="start">学习目标：完成从概念理解到行动输出的转化</text>
  <text x="72" y="155.2" fill="#334155" font-family="Microsoft YaHei, Arial" font-size="16" font-weight="400" text-anchor="start">培训页要写可观察的学习产出。</text>
  <rect x="72" y="228" width="336" height="280" rx="17.6" fill="#FFFFFF" stroke="#E2E8F0" />
  <circle cx="105.6" cy="266.4" r="17.6" fill="#F59E0B" />
  <text x="105.6" y="272.8" fill="#FFFFFF" font-family="Microsoft YaHei, Arial" font-size="16" font-weight="800" text-anchor="middle">1</text>
  <text x="137.6" y="274.4" fill="#1E293B" font-family="Microsoft YaHei, Arial" font-size="19.2" font-weight="800" text-anchor="start">识别问题</text>
  <text x="97.6" y="320.8" fill="#334155" font-family="Microsoft YaHei, Arial" font-size="13.6" font-weight="500" text-anchor="start">把现象转成可描述问题</text>
  <text x="97.6" y="362.4" fill="#334155" font-family="Microsoft YaHei, Arial" font-size="12.8" font-weight="400" text-anchor="start">- 对象、时间、影响范围</text>
  <text x="97.6" y="389.6" fill="#334155" font-family="Microsoft YaHei, Arial" font-size="12.8" font-weight="400" text-anchor="start">- 区分现象和原因</text>
  <rect x="97.6" y="460" width="124" height="27.2" rx="13.6" fill="#EFF6FF" stroke="#E2E8F0" />
  <text x="118.4" y="478.4" fill="#F59E0B" font-family="Microsoft YaHei, Arial" font-size="12" font-weight="700" text-anchor="start">能力一</text>
  <rect x="472" y="228" width="336" height="280" rx="17.6" fill="#FFFFFF" stroke="#E2E8F0" />
  <circle cx="505.6" cy="266.4" r="17.6" fill="#F59E0B" />
  <text x="505.6" y="272.8" fill="#FFFFFF" font-family="Microsoft YaHei, Arial" font-size="16" font-weight="800" text-anchor="middle">2</text>
  <text x="537.6" y="274.4" fill="#1E293B" font-family="Microsoft YaHei, Arial" font-size="19.2" font-weight="800" text-anchor="start">拆解动作</text>
  <text x="497.6" y="320.8" fill="#334155" font-family="Microsoft YaHei, Arial" font-size="13.6" font-weight="500" text-anchor="start">把目标拆到责任和节点</text>
  <text x="497.6" y="362.4" fill="#334155" font-family="Microsoft YaHei, Arial" font-size="12.8" font-weight="400" text-anchor="start">- 完成标准</text>
  <text x="497.6" y="389.6" fill="#334155" font-family="Microsoft YaHei, Arial" font-size="12.8" font-weight="400" text-anchor="start">- 风险和依赖</text>
  <rect x="497.6" y="460" width="124" height="27.2" rx="13.6" fill="#EFF6FF" stroke="#E2E8F0" />
  <text x="518.4" y="478.4" fill="#F59E0B" font-family="Microsoft YaHei, Arial" font-size="12" font-weight="700" text-anchor="start">能力二</text>
  <rect x="872" y="228" width="336" height="280" rx="17.6" fill="#FFFFFF" stroke="#E2E8F0" />
  <circle cx="905.6" cy="266.4" r="17.6" fill="#F59E0B" />
  <text x="905.6" y="272.8" fill="#FFFFFF" font-family="Microsoft YaHei, Arial" font-size="16" font-weight="800" text-anchor="middle">3</text>
  <text x="937.6" y="274.4" fill="#1E293B" font-family="Microsoft YaHei, Arial" font-size="19.2" font-weight="800" text-anchor="start">复盘改进</text>
  <text x="897.6" y="320.8" fill="#334155" font-family="Microsoft YaHei, Arial" font-size="13.6" font-weight="500" text-anchor="start">把结果沉淀为标准动作</text>
  <text x="897.6" y="362.4" fill="#334155" font-family="Microsoft YaHei, Arial" font-size="12.8" font-weight="400" text-anchor="start">- 偏差分析</text>
  <text x="897.6" y="389.6" fill="#334155" font-family="Microsoft YaHei, Arial" font-size="12.8" font-weight="400" text-anchor="start">- 有效动作复用</text>
