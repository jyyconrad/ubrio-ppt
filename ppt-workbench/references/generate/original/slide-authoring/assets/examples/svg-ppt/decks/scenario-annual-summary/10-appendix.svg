  <g id="annual-appendix-usage-contract">
  <rect x="70.4" y="505.6" width="256" height="62.4" rx="11.2" fill="#EFF6FF" stroke="#B8D8FF" />
  <text x="84.8" y="528" fill="#2563EB" font-family="Microsoft YaHei, Arial" font-size="10.4" font-weight="900" text-anchor="start">读取顺序</text>
  <text x="84.8" y="547.2" fill="#0F172A" font-family="Microsoft YaHei, Arial" font-size="8.8" font-weight="800" text-anchor="start">materials/index.md -&gt; 当前页引用素材 -&gt; 原始表格/截图</text>
  <text x="84.8" y="563.2" fill="#334155" font-family="Microsoft YaHei, Arial" font-size="8" font-weight="600" text-anchor="start">避免反复全盘检索</text>
  <rect x="355.2" y="505.6" width="256" height="62.4" rx="11.2" fill="#EFF6FF" stroke="#B8D8FF" />
  <text x="369.6" y="528" fill="#2563EB" font-family="Microsoft YaHei, Arial" font-size="10.4" font-weight="900" text-anchor="start">入页方式</text>
  <text x="369.6" y="547.2" fill="#0F172A" font-family="Microsoft YaHei, Arial" font-size="8.8" font-weight="800" text-anchor="start">先写经营判断，再把来源塞进证据槽</text>
  <text x="369.6" y="563.2" fill="#334155" font-family="Microsoft YaHei, Arial" font-size="8" font-weight="600" text-anchor="start">不要只在附录堆清单</text>
  <rect x="640" y="505.6" width="256" height="62.4" rx="11.2" fill="#EFF6FF" stroke="#B8D8FF" />
  <text x="654.4" y="528" fill="#2563EB" font-family="Microsoft YaHei, Arial" font-size="10.4" font-weight="900" text-anchor="start">缺口标注</text>
  <text x="654.4" y="547.2" fill="#0F172A" font-family="Microsoft YaHei, Arial" font-size="8.8" font-weight="800" text-anchor="start">缺数据写待补口径、Owner、截止日</text>
  <text x="654.4" y="563.2" fill="#334155" font-family="Microsoft YaHei, Arial" font-size="8" font-weight="600" text-anchor="start">不能删除不利信息</text>
  <rect x="924.8" y="505.6" width="256" height="62.4" rx="11.2" fill="#EFF6FF" stroke="#B8D8FF" />
  <text x="939.2" y="528" fill="#2563EB" font-family="Microsoft YaHei, Arial" font-size="10.4" font-weight="900" text-anchor="start">复盘追踪</text>
  <text x="939.2" y="547.2" fill="#0F172A" font-family="Microsoft YaHei, Arial" font-size="8.8" font-weight="800" text-anchor="start">同一字段进入月度经营会</text>
  <text x="939.2" y="563.2" fill="#334155" font-family="Microsoft YaHei, Arial" font-size="8" font-weight="600" text-anchor="start">保证下次复盘可比较</text>
  </g>
  <rect x="70.4" y="588.8" width="1139.2" height="43.2" rx="12.8" fill="#FFF7ED" stroke="#F59E0B" />
