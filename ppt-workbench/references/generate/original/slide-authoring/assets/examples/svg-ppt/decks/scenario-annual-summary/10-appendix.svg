  <text x="208" y="616" fill="#0F172A" font-family="Microsoft YaHei, Arial" font-size="11.2" font-weight="800" text-anchor="start">附录不是素材坟场，而是告诉模型哪些页面引用哪些素材、缺什么口径、由谁补齐。</text>
  <rect x="70.4" y="643.2" width="1139.2" height="22.4" rx="11.2" fill="#0F3B73" stroke="#0F3B73" />
  <text x="94.4" y="659.2" fill="#FFFFFF" font-family="Microsoft YaHei, Arial" font-size="8.8" font-weight="800" text-anchor="start">示例路径：materials/index.md -&gt; finance-monthly-report.xlsx -&gt; crm-contract-ledger.xlsx -&gt; delivery-pmo-ledger.xlsx -&gt; customer-success-renewal.xlsx</text>
