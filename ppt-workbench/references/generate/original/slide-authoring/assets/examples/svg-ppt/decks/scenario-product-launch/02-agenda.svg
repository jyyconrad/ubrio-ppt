  <text x="208" y="560.8" fill="#334155" font-family="Microsoft YaHei, Arial" font-size="12" font-weight="500" text-anchor="start">试用、样板、伙伴培训</text>
  <text x="1088" y="548" fill="#64748B" font-family="Microsoft YaHei, Arial" font-size="12.8" font-weight="700" text-anchor="start">行动</text>
  <text x="72" y="684.8" fill="#64748B" font-family="Microsoft YaHei, Arial" font-size="9.6" font-weight="400" text-anchor="start">示例：产品发布 / 02-agenda / 来源：模拟业务素材，真实生成时需替换为用户证据</text>
