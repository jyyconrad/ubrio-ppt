<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect x="0" y="0" width="1280" height="720" fill="#F6F8FB" />
  <text x="72" y="70.4" fill="#64748B" font-family="Microsoft YaHei, Arial" font-size="14.4" font-weight="500" text-anchor="start">产品发布 / agenda</text>
  <text x="72" y="113.6" fill="#0F172A" font-family="Microsoft YaHei, Arial" font-size="33.6" font-weight="800" text-anchor="start">发布目录：痛点、能力、价值验证和发布计划</text>
  <text x="72" y="155.2" fill="#334155" font-family="Microsoft YaHei, Arial" font-size="16" font-weight="400" text-anchor="start">产品发布 deck 应从用户问题展开，而不是从功能清单展开。</text>
  <rect x="96" y="220" width="1088" height="70.4" rx="14.4" fill="#FFFFFF" stroke="#D9E2EC" />
  <text x="128" y="264.8" fill="#1A3A6B" font-family="Microsoft YaHei, Arial" font-size="24" font-weight="900" text-anchor="start">01</text>
