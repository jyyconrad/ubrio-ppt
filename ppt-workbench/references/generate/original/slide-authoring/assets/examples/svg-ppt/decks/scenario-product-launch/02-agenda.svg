  <rect x="96" y="503.2" width="1088" height="70.4" rx="14.4" fill="#FFFFFF" stroke="#D9E2EC" />
  <text x="128" y="548" fill="#1A3A6B" font-family="Microsoft YaHei, Arial" font-size="24" font-weight="900" text-anchor="start">04</text>
