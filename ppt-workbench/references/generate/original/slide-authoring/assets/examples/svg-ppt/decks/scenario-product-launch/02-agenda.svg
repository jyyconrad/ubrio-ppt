  <text x="1088" y="264.8" fill="#64748B" font-family="Microsoft YaHei, Arial" font-size="12.8" font-weight="700" text-anchor="start">痛点</text>
  <rect x="96" y="314.4" width="1088" height="70.4" rx="14.4" fill="#FFFFFF" stroke="#D9E2EC" />
  <text x="128" y="359.2" fill="#1A3A6B" font-family="Microsoft YaHei, Arial" font-size="24" font-weight="900" text-anchor="start">02</text>
  <text x="208" y="348" fill="#0F172A" font-family="Microsoft YaHei, Arial" font-size="17.6" font-weight="800" text-anchor="start">产品能力</text>
  <text x="208" y="372" fill="#334155" font-family="Microsoft YaHei, Arial" font-size="12" font-weight="500" text-anchor="start">任务识别、跟踪、复盘</text>
  <text x="1088" y="359.2" fill="#64748B" font-family="Microsoft YaHei, Arial" font-size="12.8" font-weight="700" text-anchor="start">能力</text>
  <rect x="96" y="408.8" width="1088" height="70.4" rx="14.4" fill="#FFFFFF" stroke="#D9E2EC" />
  <text x="128" y="453.6" fill="#1A3A6B" font-family="Microsoft YaHei, Arial" font-size="24" font-weight="900" text-anchor="start">03</text>
  <text x="208" y="442.4" fill="#0F172A" font-family="Microsoft YaHei, Arial" font-size="17.6" font-weight="800" text-anchor="start">价值验证</text>
