<circle cx="888" cy="506" r="16" fill="#B91C1C"/>
<text x="888" y="512" fill="#FFFFFF" font-family="Microsoft YaHei, Arial" font-size="15" font-weight="800" text-anchor="middle">3</text>
<text x="916" y="500" fill="#B91C1C" font-family="Microsoft YaHei, Arial" font-size="13" font-weight="700" text-anchor="start">展望 · 2026</text>
<text x="916" y="524" fill="#1F2933" font-family="Microsoft YaHei, Arial" font-size="19" font-weight="800" text-anchor="start">锚定行业领先</text>
<text x="878" y="576" fill="#B91C1C" font-family="Microsoft YaHei, Arial" font-size="30" font-weight="800" text-anchor="start">5.5 亿</text>
