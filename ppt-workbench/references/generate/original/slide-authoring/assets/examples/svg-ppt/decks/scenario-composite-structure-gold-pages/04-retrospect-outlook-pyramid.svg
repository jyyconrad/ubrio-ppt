<text x="640" y="364" fill="#FFFFFF" font-family="Microsoft YaHei, Arial" font-size="18" font-weight="800" text-anchor="middle">②成果跃升</text>
<text x="640" y="270" fill="#FFFFFF" font-family="Microsoft YaHei, Arial" font-size="16" font-weight="800" text-anchor="middle">③展望领先</text>
