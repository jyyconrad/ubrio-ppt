<text x="878" y="640" fill="#2F3A3D" font-family="Microsoft YaHei, Arial" font-size="14" font-weight="500" text-anchor="start">· 联名产品线扩展至 8 条</text>
<text x="70" y="706" fill="#6B6258" font-family="Microsoft YaHei, Arial" font-size="12" font-weight="500" text-anchor="start">数据口径：2023-2025 为年度复盘实绩，2026 为规划目标；营收含线上线下全渠道</text>
