  <text x="985.6" y="608.8" fill="#0F172A" font-family="Microsoft YaHei, Arial" font-size="9.6" font-weight="800" text-anchor="start">客户成功台账</text>
  <text x="939.2" y="627.2" fill="#334155" font-family="Microsoft YaHei, Arial" font-size="8.8" font-weight="600" text-anchor="start">复购口径仍待补</text>
  </g>
  <text x="70.4" y="676.8" fill="#64748B" font-family="Microsoft YaHei, Arial" font-size="9.6" font-weight="500" text-anchor="start">素材：年度财务月报 / CRM 商机与合同清单 / 交付 PMO 台账 / 客户成功复购台账</text>
  <text x="992" y="676.8" fill="#64748B" font-family="Microsoft YaHei, Arial" font-size="9.6" font-weight="500" text-anchor="start">年度经营总结 / 03-section-results</text>
  </svg>