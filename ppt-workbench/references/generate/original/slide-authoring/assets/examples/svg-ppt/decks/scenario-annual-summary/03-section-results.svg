<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect x="0" y="0" width="1280" height="720" fill="#F6F8FB" />
  <text x="70.4" y="19.2" fill="#64748B" font-family="Microsoft YaHei, Arial" font-size="12" font-weight="600" text-anchor="start">年度经营总结 / 经营复盘 / SVG-PPT 高密度示例</text>
  <text x="70.4" y="92.8" fill="#0F172A" font-family="Microsoft YaHei, Arial" font-size="30.4" font-weight="900" text-anchor="start">第一部分：年度经营结果</text>
  <text x="70.4" y="128" fill="#334155" font-family="Microsoft YaHei, Arial" font-size="14.4" font-weight="500" text-anchor="start">先用指标证明“做成了什么”，再讲原因和差距。</text>
  <rect x="70.4" y="148.8" width="1139.2" height="33.6" rx="14.4" fill="#EFF6FF" stroke="#B8D8FF" />
  <text x="92.8" y="170.4" fill="#0F172A" font-family="Microsoft YaHei, Arial" font-size="12" font-weight="700" text-anchor="start">页面合同：年度总结必须同时写结果、差距、原因、证据口径和来年动作；缺数据时标缺口，不删问题。</text>
  <g id="annual-section-question">
  <rect x="70.4" y="200" width="416" height="336" rx="19.2" fill="#0F3B73" stroke="#0F3B73" />
  <text x="100.8" y="244.8" fill="#FFFFFF" font-family="Microsoft YaHei, Arial" font-size="19.2" font-weight="900" text-anchor="start">本章节回答什么</text>
  <text x="100.8" y="289.6" fill="#EAF3FF" font-family="Microsoft YaHei, Arial" font-size="14.4" font-weight="800" text-anchor="start">1. 年度目标是否真实达成？</text>
  <text x="100.8" y="324.8" fill="#EAF3FF" font-family="Microsoft YaHei, Arial" font-size="14.4" font-weight="800" text-anchor="start">2. 增长质量是否可持续？</text>
  <text x="100.8" y="360" fill="#EAF3FF" font-family="Microsoft YaHei, Arial" font-size="14.4" font-weight="800" text-anchor="start">3. 哪些短板会影响来年经营？</text>
  <text x="100.8" y="395.2" fill="#EAF3FF" font-family="Microsoft YaHei, Arial" font-size="14.4" font-weight="800" text-anchor="start">4. 哪些口径还必须补证据？</text>
  <rect x="100.8" y="468.8" width="312" height="35.2" rx="17.6" fill="#F59E0B" stroke="#F59E0B" />
  <text x="120" y="491.2" fill="#FFFFFF" font-family="Microsoft YaHei, Arial" font-size="12" font-weight="900" text-anchor="start">章节结论：达成目标，但质量仍需补强</text>
  <rect x="100.8" y="513.6" width="83.2" height="19.2" rx="9.6" fill="#FFFFFF" stroke="#2563EB" />
  <text x="112" y="527.2" fill="#2563EB" font-family="Microsoft YaHei, Arial" font-size="8" font-weight="900" text-anchor="start">财务口径</text>
  <rect x="195.2" y="513.6" width="83.2" height="19.2" rx="9.6" fill="#FFFFFF" stroke="#2563EB" />
  <text x="206.4" y="527.2" fill="#2563EB" font-family="Microsoft YaHei, Arial" font-size="8" font-weight="900" text-anchor="start">CRM来源</text>
  <rect x="289.6" y="513.6" width="83.2" height="19.2" rx="9.6" fill="#FFFFFF" stroke="#2563EB" />
  <text x="300.8" y="527.2" fill="#2563EB" font-family="Microsoft YaHei, Arial" font-size="8" font-weight="900" text-anchor="start">PMO证据</text>
  <rect x="384" y="513.6" width="83.2" height="19.2" rx="9.6" fill="#FFFFFF" stroke="#B91C1C" />
  <text x="395.2" y="527.2" fill="#B91C1C" font-family="Microsoft YaHei, Arial" font-size="8" font-weight="900" text-anchor="start">复购缺口</text>
  </g>
  <g id="annual-section-evidence">
  <rect x="528" y="206.4" width="681.6" height="78.4" rx="12.8" fill="#FFFFFF" stroke="#D9E2EC" />
  <text x="555.2" y="235.2" fill="#2563EB" font-family="Microsoft YaHei, Arial" font-size="16" font-weight="900" text-anchor="start">指标证据</text>
  <text x="555.2" y="260.8" fill="#0F172A" font-family="Microsoft YaHei, Arial" font-size="12.8" font-weight="800" text-anchor="start">收入达成 102，重点行业占比 58</text>
  <text x="840" y="260.8" fill="#334155" font-family="Microsoft YaHei, Arial" font-size="10.4" font-weight="600" text-anchor="start">来源：年度财务月报、CRM合同清单</text>
  <text x="555.2" y="278.4" fill="#64748B" font-family="Microsoft YaHei, Arial" font-size="8.8" font-weight="600" text-anchor="start">字段：观点 / 证据 / 解释 / 缺口 / 行动</text>
  <text x="771.2" y="278.4" fill="#2563EB" font-family="Microsoft YaHei, Arial" font-size="8.8" font-weight="800" text-anchor="start">Owner：财经+销售</text>
  <text x="952" y="278.4" fill="#334155" font-family="Microsoft YaHei, Arial" font-size="8.8" font-weight="800" text-anchor="start">动作：按行业拆毛利</text>
  <rect x="528" y="307.2" width="681.6" height="78.4" rx="12.8" fill="#FFFFFF" stroke="#D9E2EC" />
  <text x="555.2" y="336" fill="#2563EB" font-family="Microsoft YaHei, Arial" font-size="16" font-weight="900" text-anchor="start">质量证据</text>
  <text x="555.2" y="361.6" fill="#0F172A" font-family="Microsoft YaHei, Arial" font-size="12.8" font-weight="800" text-anchor="start">交付周期改善，但复购贡献仍待补</text>
  <text x="840" y="361.6" fill="#334155" font-family="Microsoft YaHei, Arial" font-size="10.4" font-weight="600" text-anchor="start">来源：PMO台账、客户成功台账</text>
  <text x="555.2" y="379.2" fill="#64748B" font-family="Microsoft YaHei, Arial" font-size="8.8" font-weight="600" text-anchor="start">字段：观点 / 证据 / 解释 / 缺口 / 行动</text>
  <text x="771.2" y="379.2" fill="#2563EB" font-family="Microsoft YaHei, Arial" font-size="8.8" font-weight="800" text-anchor="start">Owner：PMO+客成</text>
  <text x="952" y="379.2" fill="#334155" font-family="Microsoft YaHei, Arial" font-size="8.8" font-weight="800" text-anchor="start">动作：补返工和续约</text>
  <rect x="528" y="408" width="681.6" height="78.4" rx="12.8" fill="#FFFFFF" stroke="#D9E2EC" />
  <text x="555.2" y="436.8" fill="#2563EB" font-family="Microsoft YaHei, Arial" font-size="16" font-weight="900" text-anchor="start">缺口证据</text>
  <text x="555.2" y="462.4" fill="#0F172A" font-family="Microsoft YaHei, Arial" font-size="12.8" font-weight="800" text-anchor="start">毛利、复购率、续约金额仍需统一口径</text>
  <text x="840" y="462.4" fill="#334155" font-family="Microsoft YaHei, Arial" font-size="10.4" font-weight="600" text-anchor="start">动作：财经+运营进入月度经营会</text>
  <text x="555.2" y="480" fill="#64748B" font-family="Microsoft YaHei, Arial" font-size="8.8" font-weight="600" text-anchor="start">字段：观点 / 证据 / 解释 / 缺口 / 行动</text>
  <text x="771.2" y="480" fill="#2563EB" font-family="Microsoft YaHei, Arial" font-size="8.8" font-weight="800" text-anchor="start">Owner：运营负责人</text>
  <text x="952" y="480" fill="#B91C1C" font-family="Microsoft YaHei, Arial" font-size="8.8" font-weight="800" text-anchor="start">动作：统一月会字段</text>
  <rect x="528" y="531.2" width="681.6" height="46.4" rx="12.8" fill="#EFF6FF" stroke="#B8D8FF" />
  <text x="555.2" y="560" fill="#0F172A" font-family="Microsoft YaHei, Arial" font-size="12" font-weight="800" text-anchor="start">章节输出：后续页必须从“指标结果”进入“差距诊断”，不能只展示成绩。</text>
  </g>
  <g id="annual-section-source-strip">
