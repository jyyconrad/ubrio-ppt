  <text x="131.2" y="608.8" fill="#0F172A" font-family="Microsoft YaHei, Arial" font-size="9.6" font-weight="800" text-anchor="start">财务月报</text>
  <text x="84.8" y="627.2" fill="#334155" font-family="Microsoft YaHei, Arial" font-size="8.8" font-weight="600" text-anchor="start">收入达成/毛利/回款</text>
  <rect x="355.2" y="590.4" width="256" height="46.4" rx="11.2" fill="#EFF6FF" stroke="#B8D8FF" />
