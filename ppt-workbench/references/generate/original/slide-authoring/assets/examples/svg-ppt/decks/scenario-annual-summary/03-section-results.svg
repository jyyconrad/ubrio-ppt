  <rect x="640" y="590.4" width="256" height="46.4" rx="11.2" fill="#EFF6FF" stroke="#B8D8FF" />
  <text x="654.4" y="608.8" fill="#2563EB" font-family="Microsoft YaHei, Arial" font-size="9.6" font-weight="900" text-anchor="start">效率</text>
  <text x="700.8" y="608.8" fill="#0F172A" font-family="Microsoft YaHei, Arial" font-size="9.6" font-weight="800" text-anchor="start">PMO项目台账</text>
  <text x="654.4" y="627.2" fill="#334155" font-family="Microsoft YaHei, Arial" font-size="8.8" font-weight="600" text-anchor="start">周期/返工/验收</text>
  <rect x="924.8" y="590.4" width="256" height="46.4" rx="11.2" fill="#EFF6FF" stroke="#B8D8FF" />
