  <g id="annual-proof-chain">
  <rect x="912" y="281.6" width="297.6" height="283.2" rx="12.8" fill="#FFF7ED" stroke="#F59E0B" />
  <text x="931.2" y="313.6" fill="#B45309" font-family="Microsoft YaHei, Arial" font-size="16" font-weight="900" text-anchor="start">证据链写法</text>
  <rect x="929.6" y="344" width="260.8" height="28.8" rx="9.6" fill="#FFFFFF" stroke="#F6C77A" />
  <text x="942.4" y="362.4" fill="#B45309" font-family="Microsoft YaHei, Arial" font-size="9.6" font-weight="900" text-anchor="start">1 观点</text>
  <text x="998.4" y="362.4" fill="#0F172A" font-family="Microsoft YaHei, Arial" font-size="8.8" font-weight="700" text-anchor="start">先写经营判断，不写名词标签</text>
  <rect x="929.6" y="384" width="260.8" height="28.8" rx="9.6" fill="#FFFFFF" stroke="#F6C77A" />
  <text x="942.4" y="402.4" fill="#B45309" font-family="Microsoft YaHei, Arial" font-size="9.6" font-weight="900" text-anchor="start">2 证据</text>
  <text x="998.4" y="402.4" fill="#0F172A" font-family="Microsoft YaHei, Arial" font-size="8.8" font-weight="700" text-anchor="start">每条结论绑定表格、截图或会议纪要</text>
  <rect x="929.6" y="424" width="260.8" height="28.8" rx="9.6" fill="#FFFFFF" stroke="#F6C77A" />
  <text x="942.4" y="442.4" fill="#B45309" font-family="Microsoft YaHei, Arial" font-size="9.6" font-weight="900" text-anchor="start">3 解释</text>
  <text x="998.4" y="442.4" fill="#0F172A" font-family="Microsoft YaHei, Arial" font-size="8.8" font-weight="700" text-anchor="start">说明数据为什么支撑该判断</text>
  <rect x="929.6" y="464" width="260.8" height="28.8" rx="9.6" fill="#FFFFFF" stroke="#F6C77A" />
  <text x="942.4" y="482.4" fill="#B45309" font-family="Microsoft YaHei, Arial" font-size="9.6" font-weight="900" text-anchor="start">4 缺口</text>
  <text x="998.4" y="482.4" fill="#0F172A" font-family="Microsoft YaHei, Arial" font-size="8.8" font-weight="700" text-anchor="start">缺数据时标待补口径和责任人</text>
  <rect x="929.6" y="504" width="260.8" height="28.8" rx="9.6" fill="#FFFFFF" stroke="#F6C77A" />
  <text x="942.4" y="522.4" fill="#B45309" font-family="Microsoft YaHei, Arial" font-size="9.6" font-weight="900" text-anchor="start">5 动作</text>
  <text x="998.4" y="522.4" fill="#0F172A" font-family="Microsoft YaHei, Arial" font-size="8.8" font-weight="700" text-anchor="start">进入来年计划或月度经营会</text>
  </g>
