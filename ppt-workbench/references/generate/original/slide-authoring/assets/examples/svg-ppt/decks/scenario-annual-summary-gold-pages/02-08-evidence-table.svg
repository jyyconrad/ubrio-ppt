  <rect x="924.8" y="584" width="256" height="43.2" rx="11.2" fill="#EFF6FF" stroke="#B8D8FF" />
  <text x="939.2" y="601.6" fill="#2563EB" font-family="Microsoft YaHei, Arial" font-size="10.4" font-weight="900" text-anchor="start">经营</text>
  <text x="980.8" y="601.6" fill="#0F172A" font-family="Microsoft YaHei, Arial" font-size="8.8" font-weight="800" text-anchor="start">统一收入、毛利、回款口径</text>
  <text x="980.8" y="619.2" fill="#64748B" font-family="Microsoft YaHei, Arial" font-size="8.8" font-weight="600" text-anchor="start">运营负责人</text>
  <rect x="70.4" y="640" width="1139.2" height="27.2" rx="11.2" fill="#0F3B73" stroke="#0F3B73" />
  <text x="94.4" y="658.4" fill="#FFFFFF" font-family="Microsoft YaHei, Arial" font-size="10.4" font-weight="900" text-anchor="start">证据表合同：每个经营结论必须有来源、解释、缺口和Owner；不能用“持续优化、加强管理”替代表格证据。</text>
