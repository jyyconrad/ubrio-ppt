<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720"><rect x="0" y="0" width="1280" height="720" fill="#EAEAEC"/><rect x="64" y="28" width="1152" height="50" rx="10" fill="#2E1B5E"/><text x="640" y="61" fill="#FFFFFF" font-family="Microsoft YaHei, Arial" font-size="24" font-weight="700" text-anchor="middle">年度四大工作亮点 · 一体化提升经营质效</text><text x="640" y="99" fill="#6E6683" font-family="Microsoft YaHei, Arial" font-size="13" text-anchor="middle">中心四词凝练全年主线，四角详情卡分述具体工作与取得成果</text><polygon points="640,384 462.8,266.6 430.4,348.4" fill="#E4D9F3"/><polygon points="640,384 849.6,348.4 817.2,266.6" fill="#E4D9F3"/><polygon points="640,384 430.4,419.6 462.8,501.4" fill="#E4D9F3"/><polygon points="640,384 817.2,501.4 849.6,419.6" fill="#E4D9F3"/><rect x="64" y="120" width="404" height="256" rx="14" fill="#FFFFFF" stroke="#D8CCEA" stroke-width="1.5"/><circle cx="88" cy="144" r="17" fill="#6B2D9C"/><text x="88" y="150" fill="#FFFFFF" font-family="Microsoft YaHei, Arial" font-size="17" font-weight="700" text-anchor="middle">01</text><text x="112" y="160" fill="#241238" font-family="Microsoft YaHei, Arial" font-size="17" font-weight="700" text-anchor="start">运营提效与流程优化</text><text x="90" y="196" fill="#6B2D9C" font-family="Microsoft YaHei, Arial" font-size="12.5" font-weight="700" text-anchor="start">具体工作</text><text x="90" y="219" fill="#3B2A4D" font-family="Microsoft YaHei, Arial" font-size="15" text-anchor="start">引入流程自动化与审批直通，</text><text x="90" y="239" fill="#3B2A4D" font-family="Microsoft YaHei, Arial" font-size="15" text-anchor="start">砍去冗余人工环节</text><text x="90" y="274" fill="#6B2D9C" font-family="Microsoft YaHei, Arial" font-size="12.5" font-weight="700" text-anchor="start">取得成果</text><text x="90" y="297" fill="#3B2A4D" font-family="Microsoft YaHei, Arial" font-size="15" text-anchor="start">运营效率提升20%，</text><text x="90" y="317" fill="#3B2A4D" font-family="Microsoft YaHei, Arial" font-size="15" text-anchor="start">年度节省人工成本300万元</text><rect x="812" y="120" width="404" height="256" rx="14" fill="#FFFFFF" stroke="#D8CCEA" stroke-width="1.5"/><circle cx="1192" cy="144" r="17" fill="#6B2D9C"/><text x="1192" y="150" fill="#FFFFFF" font-family="Microsoft YaHei, Arial" font-size="17" font-weight="700" text-anchor="middle">03</text><text x="832" y="160" fill="#241238" font-family="Microsoft YaHei, Arial" font-size="17" font-weight="700" text-anchor="start">降本节支与资源集约</text><text x="832" y="196" fill="#6B2D9C" font-family="Microsoft YaHei, Arial" font-size="12.5" font-weight="700" text-anchor="start">具体工作</text><text x="832" y="219" fill="#3B2A4D" font-family="Microsoft YaHei, Arial" font-size="15" text-anchor="start">集中采购与资源池化，</text><text x="832" y="239" fill="#3B2A4D" font-family="Microsoft YaHei, Arial" font-size="15" text-anchor="start">压降低效重复投入</text><text x="832" y="274" fill="#6B2D9C" font-family="Microsoft YaHei, Arial" font-size="12.5" font-weight="700" text-anchor="start">取得成果</text><text x="832" y="297" fill="#3B2A4D" font-family="Microsoft YaHei, Arial" font-size="15" text-anchor="start">综合运营成本下降15%，</text><text x="832" y="317" fill="#3B2A4D" font-family="Microsoft YaHei, Arial" font-size="15" text-anchor="start">采购单价平均下降8%</text><rect x="64" y="392" width="404" height="256" rx="14" fill="#FFFFFF" stroke="#D8CCEA" stroke-width="1.5"/><circle cx="88" cy="416" r="17" fill="#6B2D9C"/><text x="88" y="422" fill="#FFFFFF" font-family="Microsoft YaHei, Arial" font-size="17" font-weight="700" text-anchor="middle">02</text><text x="112" y="432" fill="#241238" font-family="Microsoft YaHei, Arial" font-size="17" font-weight="700" text-anchor="start">合规经营与风险管控</text><text x="90" y="468" fill="#6B2D9C" font-family="Microsoft YaHei, Arial" font-size="12.5" font-weight="700" text-anchor="start">具体工作</text><text x="90" y="491" fill="#3B2A4D" font-family="Microsoft YaHei, Arial" font-size="15" text-anchor="start">搭建合规清单与风险预警，</text><text x="90" y="511" fill="#3B2A4D" font-family="Microsoft YaHei, Arial" font-size="15" text-anchor="start">全流程留痕可追溯</text><text x="90" y="546" fill="#6B2D9C" font-family="Microsoft YaHei, Arial" font-size="12.5" font-weight="700" text-anchor="start">取得成果</text><text x="90" y="569" fill="#3B2A4D" font-family="Microsoft YaHei, Arial" font-size="15" text-anchor="start">重大合规事件零发生，</text><text x="90" y="589" fill="#3B2A4D" font-family="Microsoft YaHei, Arial" font-size="15" text-anchor="start">审计问题整改率100%</text><rect x="812" y="392" width="404" height="256" rx="14" fill="#FFFFFF" stroke="#D8CCEA" stroke-width="1.5"/><circle cx="1192" cy="416" r="17" fill="#6B2D9C"/><text x="1192" y="422" fill="#FFFFFF" font-family="Microsoft YaHei, Arial" font-size="17" font-weight="700" text-anchor="middle">04</text><text x="832" y="432" fill="#241238" font-family="Microsoft YaHei, Arial" font-size="17" font-weight="700" text-anchor="start">创新驱动与市场拓展</text><text x="832" y="468" fill="#6B2D9C" font-family="Microsoft YaHei, Arial" font-size="12.5" font-weight="700" text-anchor="start">具体工作</text><text x="832" y="491" fill="#3B2A4D" font-family="Microsoft YaHei, Arial" font-size="15" text-anchor="start">上线两款新品并试水新渠道，</text><text x="832" y="511" fill="#3B2A4D" font-family="Microsoft YaHei, Arial" font-size="15" text-anchor="start">小步快跑迭代验证</text><text x="832" y="546" fill="#6B2D9C" font-family="Microsoft YaHei, Arial" font-size="12.5" font-weight="700" text-anchor="start">取得成果</text><text x="832" y="569" fill="#3B2A4D" font-family="Microsoft YaHei, Arial" font-size="15" text-anchor="start">新品贡献营收12%，</text><text x="832" y="589" fill="#3B2A4D" font-family="Microsoft YaHei, Arial" font-size="15" text-anchor="start">成功拓展两条市场渠道</text><circle cx="564" cy="308" r="72" fill="#6B2D9C"/><text x="564" y="306" fill="#FFFFFF" font-family="Microsoft YaHei, Arial" font-size="30" font-weight="700" text-anchor="middle">提效</text><text x="564" y="334" fill="#E7DBF5" font-family="Microsoft YaHei, Arial" font-size="12" text-anchor="middle">Efficiency</text><circle cx="716" cy="308" r="72" fill="#6B2D9C"/><text x="716" y="306" fill="#FFFFFF" font-family="Microsoft YaHei, Arial" font-size="30" font-weight="700" text-anchor="middle">降本</text><text x="716" y="334" fill="#E7DBF5" font-family="Microsoft YaHei, Arial" font-size="12" text-anchor="middle">Cost Saving</text><circle cx="564" cy="460" r="72" fill="#6B2D9C"/><text x="564" y="458" fill="#FFFFFF" font-family="Microsoft YaHei, Arial" font-size="30" font-weight="700" text-anchor="middle">合规</text><text x="564" y="486" fill="#E7DBF5" font-family="Microsoft YaHei, Arial" font-size="12" text-anchor="middle">Compliance</text><circle cx="716" cy="460" r="72" fill="#6B2D9C"/><text x="716" y="458" fill="#FFFFFF" font-family="Microsoft YaHei, Arial" font-size="30" font-weight="700" text-anchor="middle">创新</text><text x="716" y="486" fill="#E7DBF5" font-family="Microsoft YaHei, Arial" font-size="12" text-anchor="middle">Innovation</text></svg>