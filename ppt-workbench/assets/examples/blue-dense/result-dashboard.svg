    <rect x="54" y="236" width="176" height="38" rx="4" fill="#0B4E9B"/>
    <text x="68" y="261" font-family="Hiragino Sans GB" font-size="15" font-weight="700" fill="#FFFFFF">01｜库位重排</text>
    <rect x="76" y="296" width="44" height="17" rx="2" fill="#B8D7F3"/>
    <rect x="76" y="318" width="68" height="17" rx="2" fill="#6FA8DD"/>
