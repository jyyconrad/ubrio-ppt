    <line x1="634" y1="139" x2="634" y2="167" stroke="#BAC8D8" stroke-width="1"/>
    <circle cx="667" cy="153" r="4" fill="#1477C9"/>
    <text x="682" y="158" font-family="Hiragino Sans GB" font-size="16" fill="#183A61">仅描述同期变化，不推断因果</text>
    <rect x="1087" y="139" width="117" height="28" rx="3" fill="#DCEBFA"/>
    <text x="1113" y="159" font-family="Hiragino Sans GB" font-size="15" font-weight="700" fill="#0B4E9B">合成演示</text>
  </g>

  <g id="actions-header">
