    <rect x="54" y="126" width="152" height="54" rx="4" fill="#0B4E9B"/>
    <text x="77" y="159" font-family="Hiragino Sans GB" font-size="20" font-weight="700" fill="#FFFFFF">复盘口径</text>
    <circle cx="237" cy="153" r="4" fill="#1477C9"/>
    <text x="252" y="158" font-family="Hiragino Sans GB" font-size="16" fill="#183A61">同一仓配网络</text>
