<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <g id="title-layer">
    <rect x="54" y="38" width="7" height="55" rx="3" fill="#0B4E9B"/>
    <text x="78" y="72" font-family="Hiragino Sans GB" font-size="32" font-weight="700" fill="#0A2F61">四项运营指标均改善，下一步将三项机制固化到日常作业</text>
    <text x="78" y="98" font-family="Hiragino Sans GB" font-size="15" fill="#5B6F86">仓储订单运营复盘｜合成演示｜对比口径：演示期起点与演示期当前</text>
    <line x1="54" y1="112" x2="1226" y2="112" stroke="#B8C6D8" stroke-width="1"/>
  </g>

  <g id="context-strip">
