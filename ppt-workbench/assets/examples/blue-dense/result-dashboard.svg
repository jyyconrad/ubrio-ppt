    <text x="1101" y="485" font-family="Hiragino Sans GB" font-size="26" font-weight="700" fill="#1477C9">1.4</text>
    <text x="1144" y="484" font-family="Hiragino Sans GB" font-size="15" fill="#60758D">天</text>
    <line x1="968" y1="553" x2="1204" y2="553" stroke="#AAB9CA" stroke-width="1"/>
    <rect x="1005" y="504" width="50" height="49" fill="#AFCBE8"/>
    <rect x="1118" y="526" width="50" height="27" fill="#0B4E9B"/>
    <text x="968" y="579" font-family="Hiragino Sans GB" font-size="15" fill="#556B82">变化：缩短 1.1 天</text>
  </g>

  <g id="action-footnotes">
